(function(){

    if(k>=11)return [2.2,'#cfd2d6',2.4,8];
    if(k>=7) return [1.6,'#d6d8dc',1.6,10];

  }
  var FILL=false; // poner true para volver a dibujar mapas pequeños de relleno
  var svg=document.getElementById('bgCol'),lastW=0;
  function render(){
    if(!FILL||window.matchMedia('(max-width:600px)').matches){svg.innerHTML='';lastW=window.innerWidth;return}
    var W=window.innerWidth,H=window.innerHeight,f=Math.min(1,Math.max(.5,W/1300)),seed=11,out='',placed=[];
    function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    function shape(k,cx,cy,sw,col,nr,step){
      var pts=[],dots='';
      P.forEach(function(p,i){
        var x=cx+p[0]*k,y=cy+p[1]*k;
        pts.push(x.toFixed(1)+','+y.toFixed(1));
        if(i%step===0)dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+nr+'" fill="'+col+'"/>';

      }
      if(best){placed.push([best[0],best[1],hw,hh]);var st=style(k0);shape(k,best[0],best[1],st[0],st[1],st[2],st[3])}
    });
    for(var j=0;j<25;j++){
      var R=[2,2.5,4,6,1.5];
      out+='<circle cx="'+(rnd()*W).toFixed(0)+'" cy="'+(rnd()*H).toFixed(0)+'" r="'+R[Math.floor(rnd()*R.length)]+'" fill="#cfd2d6" opacity="'+(.5+rnd()*.4).toFixed(2)+'"/>';
    }
    svg.innerHTML=out;lastW=W;
  }
  render();
  var tm;window.addEventListener('resize',function(){
    clearTimeout(tm);tm=setTimeout(function(){if(Math.abs(window.innerWidth-lastW)>40)render()},200);
  });
})();
</script>
