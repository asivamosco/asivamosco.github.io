<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terrorismo · Así Vamos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;600;700&family=Montserrat:wght@700;800&display=swap&family=Roboto+Condensed:wght@400;500;700" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/shell.css?v=26">
<style>
/* Terrorismo (terrorismo, masacres y fuerza pública): subir es lo malo (gris) y bajar lo bueno (ámbar): son los colores por defecto de shell.css para las páginas de detalle.
   Misma disposición que narcotrafico.html: sin índice (cifras reales), se abre en Nacional (3 temas), Destacados y Dptos. */
.tr.g{grid-template-columns:22px minmax(0,1fr) auto}
.tr .nm{min-width:0}
.glist{overflow-x:hidden}
.tr .nm>small{font-size:12px;line-height:1.2}
/* Nacional: la fila de un tema por encima (o en línea con) su promedio de 12 meses se pinta en el gris de "malo"; por debajo, en ámbar (la intensidad sigue cuánto se aleja).
   Solo en Nacional: en Dptos las filas siguen el color por defecto (variación frente al mismo mes del año anterior) */
body[data-av-vista="com"] .row{background:rgba(var(--mal-rgb,100,116,139),var(--a,.1))}
body[data-av-vista="com"] .row.rw-dn{background:rgba(var(--ok-rgb),var(--a,.1))}
/* Pestañas del panel (Tema / Armas y medios / Departamentos / Acciones / Fuentes / Municipios): una sola línea a todo el ancho del panel (escritorio) */
@media(min-width:601px){
  .hero.wt{grid-template-areas:"tabs tabs" "ttl ttl" "big vars" "src src"!important}
  .hero.wt.gr{grid-template-areas:"tabs tabs" "ttl ttl" "gl gl"!important}
  .hero .htabs{justify-self:stretch;display:flex;flex-wrap:nowrap;gap:6px}
  .hero .htabs button{flex:1 1 0;min-width:0;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
/* Nacional: el panel "Por tema" va a la derecha (escritorio). Se invierte el sentido de las columnas de .top y se restaura el normal en sus hijos */
@media(min-width:601px){
  body[data-av-vista="com"] .top{direction:rtl}
  body[data-av-vista="com"] .top>*{direction:ltr}
}
/* Nacional: el panel del tema va en dos columnas. Izquierda: la cifra del mes y debajo "Vs. promedio" y "Promedio 12 meses previos".
   Derecha: los 4 meses previos (solo el valor) (lista .prev que arma asivamos.js con dims.com.prev) */
@media(min-width:601px){
  body[data-av-vista="com"] .top .hero.wt:not(.gr){grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;column-gap:20px!important;grid-template-areas:"tabs tabs" "ttl ttl" "big prev" "vars prev" "src src"!important}
}
@media(max-width:600px){
  body[data-av-vista="com"] .top .hero:not(.gr){grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;grid-template-areas:"kick kick" "big prev" "vars prev" "src src"!important}
}
body[data-av-vista="com"] .top .hero:not(.gr) .vars{grid-template-columns:1fr!important;align-self:start}
body[data-av-vista="com"] .top .hero:not(.gr) .prev{align-self:start;margin-top:0}
body[data-av-vista="com"] .top .hero:not(.gr) .prev .pr{gap:6px;font-size:13px}
body[data-av-vista="com"] .top .hero:not(.gr) .prev .pr b{font-size:14px}
/* Pantallas muy angostas: la lista de meses previos pasa a todo el ancho, debajo de la cifra y las variaciones */
@media(max-width:380px){
  body[data-av-vista="com"] .top .hero:not(.gr){grid-template-columns:auto minmax(0,1fr)!important;grid-template-areas:"kick kick" "big vars" "prev prev" "src src"!important}
  body[data-av-vista="com"] .top .hero:not(.gr) .vars{grid-template-columns:1fr 1fr!important}
}
/* Pestañas de las gráficas (12 meses / mismo mes / trimestre). :where() deja especificidad 0: si shell.css ya estiliza .tabs/.htabs, manda shell.css */
:where(.gtabs){display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
:where(.gtabs) button{flex:1 1 0;min-width:0;padding:4px 8px;border:1px solid #c9d4da;border-radius:999px;background:#fff;color:#12303f;font:inherit;font-size:.85em;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:where(.gtabs) button[aria-pressed="true"]{background:#12303f;border-color:#12303f;color:#fff}
/* Sin municipios para el departamento elegido: la ficha no aparece en el carrusel del celular */
@media(max-width:600px){ body .top .car>.card.nada{display:none!important} }
</style>
</head>
<body class="app det">
<header class="hd">
  <div class="hd-left">
    <h1 class="brand"><a class="home" href="../index.html" aria-label="Así Vamos, volver al inicio"><span class="brand-col"><span class="brand-txt" aria-hidden="true"><span class="b1">Así</span> <span class="b2">Vamos</span><svg class="brand-ico" viewBox="4 7 39.5 38.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="6" y="33" width="6.5" height="11"/><rect x="15" y="26" width="7" height="18"/><rect x="24.5" y="29" width="7.5" height="15"/><rect x="34.5" y="21" width="7" height="23"/><polyline points="8,21 18,14 28,18 38,11"/><g fill="#12303d"><circle cx="8" cy="21" r="2.8"/><circle cx="18" cy="14" r="2.8"/><circle cx="28" cy="18" r="2.8"/><circle cx="38" cy="11" r="2.8"/></g></svg></span><span class="brand-sub" aria-hidden="true">COLOMBIA</span></span></a></h1>
  </div>
  <div class="hd-title" id="hdTitle" aria-live="polite"></div>
  <nav class="hd-mid" aria-label="Vista">
    <button type="button" class="vt" data-vista="com" aria-pressed="true">Nacional</button>
    <button type="button" class="vt" data-vista="dest" aria-pressed="false">Destacados</button>
    <button type="button" class="vt" data-vista="dep" aria-pressed="false">Dptos</button>
  </nav>
  <div class="hd-right">
    <div class="btn-group">
      <a class="help-btn" href="../index.html" aria-label="Volver al inicio" title="Inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h5v-6h3v6h5V10"/></svg></a>
    </div>
  </div>
</header>
<main id="app" aria-live="polite"><div class="card err mute">Cargando…</div></main>
<footer class="site-foot">
  <div class="foot-in">
    <div class="ad-wrap" id="adWrap">
      <div class="ad-label">Aliado estratégico</div>
      <div class="sp" id="adA"><span>Espacio publicitario</span></div>
    </div>
    <p class="foot-txt">Así Vamos © 2026 | Datos oficiales | asivamos.co@gmail.com</p>
  </div>
</footer>

<script src="asivamos.js"></script>
<script>
const {fmt, sg, cls, flecha, vp, esc} = AV;
const fm0 = n => fmt(n, 0);
const pct = (v, d = 2) => v == null ? '—' : sg(v, d) + ' %';
const celda = (l, t, c = '') => `<div><span class="mute">${l}</span><b${c ? ` class="${c}"` : ''}>${t}</b></div>`;
const SRC = D => `${D.periodo.etiqueta} · Colombia · Fuente: ${D.fuente}`;
// Sin índice: las cifras son reales. "hechos" = eventos de terrorismo + víctimas de masacres + uniformados afectados (lo calcula kpi.vw_terrorismo_detalle); cada elemento trae su unidad
const und = x => x.unidad || 'hechos';
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
// Nombres cortos solo en la lista de Nacional; en los demás paneles se dejan largos (clave: codigo del tema)
const NCORTO = {T: 'Terrorismo', M: 'Masacres', F: 'Fuerza Pública'};
// Estado frente al promedio mensual de los 12 meses previos (el mes actual no entra en el promedio). "En línea" = dentro de la banda (hero.banda_pct)
const EST = {encima: 'Por encima', linea: 'En línea', debajo: 'Por debajo'};
const estFrase = e => ({encima: 'Por encima', linea: 'En línea con', debajo: 'Por debajo'})[e] + ' del promedio mensual de los 12 meses previos';
const refTxt = r => (r || []).map(x => `${esc(x.nombre)}: ${sg(x.var_ref_pct)} % vs. promedio de los 12 meses previos`).join(' · ');
// Promedio de hechos: 1 decimal (es un promedio de conteos)
const prom = x => x.ref_12m == null ? '—' : `${fmt(x.ref_12m, 1)} ${esc(und(x))}`;
const TOP_REF = 'Variación porcentual de los hechos frente al mismo mes de hace un año; debajo, el cambio en número de hechos (terrorismo: eventos; masacres: víctimas; Fuerza Pública: afectados). Toca un departamento para ver su detalle.';

// Panel de un departamento: hechos del mes, el valor de cada fuente (afectación a la Fuerza Pública, terrorismo y masacres) y su % del total nacional.
// Las fuentes salen de los hijos del departamento (los que no tienen hechos en el mes no vienen: valen 0)
const fuenteVal = (x, pref) => { const h = (x.hijos || []).find(h => String(h.nombre).startsWith(pref)); return h ? h.cantidad : 0; };
const heroEnt = (x, D) => ({
  ttl: x.nombre, big: fm0(x.cantidad), unit: esc(und(x)), com: '', src: SRC(D),
  filas: celda('Afectación', fm0(fuenteVal(x, 'Afectación')))
    + celda('Terrorismo', fm0(fuenteVal(x, 'Terrorismo')))
    + celda('Masacres', fm0(fuenteVal(x, 'Masacres')))
    + celda('Del total de hechos', `${fmt(x.participacion_pct, 1)} %`)});

// Panel de un tema (terrorismo, masacres, fuerza pública): cantidad real del mes frente al promedio de 12 meses previos
const heroComp = (x, D) => ({
  ttl: x.nombre, big: fm0(x.cantidad), unit: esc(und(x)), com: x.comentario_popular, src: SRC(D),
  extra: x.estado ? `${esc(estFrase(x.estado))} (en línea: ±${fmt((D.hero || {}).banda_pct, 0)} %)` : '',
  filas: vp('Vs. promedio 12 meses', x.var_ref_pct, pct(x.var_ref_pct))
    + celda('Promedio 12 meses previos', prom(x))});

// Hijos de un departamento (las 3 fuentes), ordenados por cantidad; la barra es su peso dentro del departamento
const hijosGet = x => { const hs = [...(x.hijos || [])].sort((a, b) => b.cantidad - a.cantidad), mx = Math.max(...hs.map(h => h.participacion_pct || 0), .01);
  return hs.map(h => ({nombre: h.nombre, valTxt: fm0(h.cantidad), delta: h.var_anual_pct,
    sub: `${flecha(h.var_anual_pct)} ${h.var_anual_pct == null ? 'nuevo' : sg(h.var_anual_pct, 1) + ' %'}`, w: 100 * (h.participacion_pct || 0) / mx})); };

// Hijos de un tema (armas y medios / departamentos de masacres / acciones): cantidad real; a la derecha su peso dentro del tema; debajo, el cambio frente al promedio mensual de los 12 meses previos
const hijosComp = x => { const hs = [...(x.hijos || [])].sort((a, b) => b.cantidad - a.cantidad), mx = Math.max(...hs.map(h => h.participacion_pct || 0), .01);
  return hs.map(h => ({nombre: h.nombre, valTxt: fm0(h.cantidad), delta: 0,
    det: h.var_ref_pct == null ? '' : `${pct(h.var_ref_pct, 1)} vs. promedio 12 meses previos`,
    sub: `${fmt(h.participacion_pct, 1)} %`, w: 100 * (h.participacion_pct || 0) / mx})); };

// Municipios del departamento elegido: total de hechos y, debajo, el valor de cada una de las 3 fuentes (sin municipios con hechos: ni pestaña ni ficha)
const munGet = x => { const ms = x.municipios || [], mx = Math.max(...ms.map(m => m.cantidad || 0), 1);
  return ms.map(m => ({nombre: m.nombre, valTxt: fm0(m.cantidad), delta: m.var_anual_pct,
    sub: `${flecha(m.var_anual_pct)} ${m.var_anual_pct == null ? 'nuevo' : sg(m.var_anual_pct, 1) + ' %'}`, w: 100 * (m.cantidad || 0) / mx,
    det: `Terrorismo ${fm0(m.terrorismo)} · Masacres ${fm0(m.masacres)} · F. Pública ${fm0(m.fuerza_publica)}`})); };
const municipios = {label: 'Municipios', get: munGet,
  nota: 'Hechos del mes en cada municipio; debajo, variación frente a hace un año. Terrorismo: eventos; masacres: víctimas; F. Pública: uniformados afectados.'};

// Campos comunes de las dimensiones
const base = k => ({
  k, medida: 'Hechos del mes', ref: D => (((D.dimensiones || {})[k] || {}).referencias || []).map(r => `${esc(r.nombre)}: ${sg(r.var_anual_pct)} % en hechos`).join(' · '),
  nom: x => x.nombre, val: x => x.cantidad, valTxt: x => fm0(x.cantidad), vr: x => x.var_anual_pct,
  ord: (a, b) => a.puesto_cantidad - b.puesto_cantidad, serie: x => x.serie_12m,
  topSub: x => `${sg(x.diferencia, 0)} ${und(x)}`, top: true, topRef: TOP_REF,
  topTxt: {upS: 'aumentó sus hechos', dnS: 'redujo sus hechos'},
  nuevos: {filtro: x => x.cantidad > 0, txt: x => `${fm0(x.cantidad)} ${und(x)}`},
  hero: heroEnt,
  hijos: {label: x => x.hijos_titulo || 'Fuentes', get: hijosGet,
    nota: d => `Cantidad del mes; debajo, variación frente a hace un año. La barra muestra su peso dentro de ${esc(d.nombre)}.`}
});

AV.init({
  ind: 'terrorismo', title: 'Terrorismo', docTitle: 'Terrorismo',
  vista0: 'com', sinTotal: true,   // sin índice: no hay ficha Total; se abre en Nacional (los 3 temas)
  pmov: {meses: 3, card: 'Trimestre móvil', ant: 'mismo trimestre del año anterior'},   // trimestre móvil (los últimos 3 meses, p. ej. Ago–Oct) de cada año
  aniosMov: ['dep'],   // Dptos: barras verticales, una por año con el trimestre móvil en el eje X, en suma de hechos (item.serie_anios, con 'temas' por fuente)
  deltaMes: () => null,   // sin índice no hay flecha de variación mensual en el título
  // Gráficas: temas y departamentos en cantidades reales (con su propia unidad); los temas con el color según el promedio de 12 meses previos (banda ±hero.banda_pct).
  // Departamentos (por.dep): siguen contra el mismo mes del año anterior
  g: {dec: () => 0, unit: (ctx, D, s) => ' ' + ((s && s.d && und(s.d)) || 'hechos'), vd: 1, vs: ' %', vf: 'var_ref_pct', useBanda: true, refKey: 'ref_12m', refLbl: 'promedio 12 meses previos',
    ley: '<span class="up">●</span> por encima del promedio de los 12 meses previos (fuera de la banda) &nbsp; <span class="dn">●</span> por debajo',
    nulo: () => '', calcMM: false, mmNota: 'Cifra sobre cada punto: valor del mes · debajo: variación frente al promedio mensual de los 12 meses previos a ese mes',
    por: {dep: {barras: 'suma', vf: 'var_anual_pct', useBanda: false, refKey: 'valor_hace_12', refLbl: undefined, ley: undefined, nulo: x => x.cantidad > 0 ? 'nuevo' : '—'},
          comp: {barras: true}}},   // Temas: la gráfica de trimestre móvil también son barras
  tit: {ent: (D, s) => s && s.tipo === 'dep' ? (((s.d.serie_anios || [])[0] || {}).temas ? 'Hechos por tema: trimestre móvil, por año' : 'Hechos del trimestre móvil, por año') : 'Hechos por mes: últimos 12 meses'},
  // No hay indicador principal: todos los destacados se muestran
  esNac: () => false,
  esVarMes: () => false,
  dims: {
    com: {...base('componentes'), una: 'Tema', plural: 'Temas', ning: 'Ningún tema', titulo: D => D.periodo.mes_nombre, kick: 'Tema',   // el panel lleva el mes reciente (p. ej. Octubre)
      medida: () => '',   // sin subtítulo: el mes ya va en el título
      ref: D => `Cantidades del mes: eventos de terrorismo, víctimas de masacres y uniformados afectados. A la derecha, la variación frente al promedio mensual de los 12 meses previos (en línea: ±${fmt((D.hero || {}).banda_pct, 0)} %).`,
      val: x => Math.abs(x.var_ref_pct || 0),
      vr: x => x.var_ref_pct,
      // Color de la fila: gris si está por encima o en línea, ámbar si está por debajo; intensidad = cuánto se aleja del promedio (50 % o más = máxima)
      rowCls: x => x.estado === 'debajo' ? 'rw-dn' : '',
      alfa: x => Math.abs(x.var_ref_pct || 0) / 50,
      top: false, topOk: x => !!x.estado && x.estado !== 'linea',
      nom: x => NCORTO[x.codigo] || x.nombre,
      valTxt: x => `${fm0(x.cantidad)} ${und(x)}`,
      opt: x => `${fm0(x.cantidad)} ${und(x)} · ${NCORTO[x.codigo] || x.nombre}`,
      sub: x => x.ref_12m == null ? '' : `Prom. 12 meses: ${prom(x)}`,
      hero: (x, D) => heroComp(x, D),
      prev: {titulo: (D, d) => `Meses anteriores (${und(d)})`},   // los 4 meses previos, solo su valor (columna derecha del panel)
      // Tres gráficas por tema: últimos 12 meses, mismo mes por año y trimestre móvil por año (el mismo formato de Dptos)
      graficas: [
        {lbl: 'Últimos 12 meses', titulo: (D, s) => `${cap(und(s.d))} por mes: últimos 12 meses`, datos: d => d.serie_12m},
        {lbl: 'Mismo mes por año', titulo: (D, s) => `${cap(und(s.d))}: ${D.periodo.mes_nombre.toLowerCase()} de cada año`, datos: d => d.serie_mismo_mes, mm: true,
          ov: {vf: 'var_anual_pct', useBanda: false, mmNota: 'Cifra sobre cada punto: valor del mes · debajo: variación frente al mismo mes del año anterior'}},
        {lbl: 'Trimestre móvil', titulo: (D, s) => `${cap(und(s.d))}: trimestre móvil, por año`, datos: d => d.serie_anios, anual: true}
      ],
      hijos: {label: x => x.hijos_titulo || 'Detalle', get: hijosComp,
        nota: (d, D) => `Cantidad real del mes en cada categoría de ${esc(d.nombre.toLowerCase())}. A la derecha, su peso dentro del total (la barra muestra ese mismo peso); debajo, el cambio frente al promedio mensual de los 12 meses previos.`}},
    dep: {...base('departamentos'), una: 'Departamento', plural: 'Departamentos', ning: 'Ningún departamento', titulo: 'Por departamento', kick: 'Hechos por departamento', hijos2: municipios}
  }
});
</script>
</body>
</html>
