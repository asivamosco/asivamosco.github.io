<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Economía · Así Vamos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;600;700&family=Montserrat:wght@700;800&display=swap&family=Roboto+Condensed:wght@400;500;700" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/shell.css?v=26">
<style>
/* Economía: crecer es lo bueno (ámbar) y caer lo malo (gris), al revés que en inflación y desempleo */
body.det{--up:var(--ok); --dn:var(--mal); --up-l:var(--ok); --dn-l:var(--mal);
  --up-t:var(--ok-txt); --dn-t:var(--mal-txt); --up-hd:var(--ok-hd); --dn-hd:var(--mal-hd)}
body.det .row{background:rgba(var(--ok-rgb),var(--a,.1))}
</style>
</head>
<body class="app det">
<header class="hd">
  <div class="hd-left">
    <h1 class="brand"><a class="home" href="../index.html" aria-label="Así Vamos, volver al inicio"><span class="brand-col"><span class="brand-txt" aria-hidden="true"><span class="b1">Así</span> <span class="b2">Vamos</span><svg class="brand-ico" viewBox="4 7 39.5 38.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="6" y="33" width="6.5" height="11"/><rect x="15" y="26" width="7" height="18"/><rect x="24.5" y="29" width="7.5" height="15"/><rect x="34.5" y="21" width="7" height="23"/><polyline points="8,21 18,14 28,18 38,11"/><g fill="#12303d"><circle cx="8" cy="21" r="2.8"/><circle cx="18" cy="14" r="2.8"/><circle cx="28" cy="18" r="2.8"/><circle cx="38" cy="11" r="2.8"/></g></svg></span><span class="brand-sub" aria-hidden="true">COLOMBIA</span></span></a></h1>
  </div>
  <div class="hd-title" id="hdTitle" aria-live="polite"></div>
  <nav class="hd-mid" aria-label="Vista">
    <button type="button" class="vt" data-vista="gen" aria-pressed="true">Total</button>
    <button type="button" class="vt" data-vista="dest" aria-pressed="false">Destacados</button>
    <button type="button" class="vt" data-vista="sec" aria-pressed="false">Sectores</button>
    <button type="button" class="vt" data-vista="act" aria-pressed="false">Actividades</button>
  </nav>
  <div class="hd-right">
    <div class="btn-group">
      <a class="help-btn" href="../index.html" aria-label="Volver al inicio" title="Inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h5v-6h3v6h5V10"/></svg></a>
    </div>
  </div>
</header>
<main id="app" aria-live="polite"><div class="card err mute">Cargando…</div></main>
<footer class="site-foot">
  <div class="foot-in">
    <div class="ad-wrap" id="adWrap">
      <div class="ad-label">Aliado estratégico</div>
      <div class="sp" id="adA"><span>Espacio publicitario</span></div>
    </div>
    <p class="foot-txt">Así Vamos © 2026 | Datos oficiales | asivamos.co@gmail.com</p>
  </div>
</footer>

<script src="asivamos.js"></script>
<script>
const {fmt, sg, cls, flecha, nm, vp, esc} = AV;
const SEC = {primarias: 'Primarias', secundarias: 'Secundarias', terciarias: 'Terciarias'};
const secTxt = s => SEC[s] || s;

// Fila del índice ISE dentro del panel del indicador
const idx = v => v == null ? '' : `<div><span class="mute">Índice ISE</span><b>${fmt(v)}</b></div>`;
// Filas del panel de un sector o una actividad
const filasEnt = x => idx(x.indice) + vp('Vs. hace un año', x.var_anual_pp, sg(x.var_anual_pp))
  + (x.brecha_vs_total != null ? vp('Frente al total', x.brecha_vs_total, sg(x.brecha_vs_total)) : '');

// Gráfica propia de Economía (el motor la usa vía cfg.graf).
// campo = 'indice' grafica el nivel del índice ISE; 'var' grafica el crecimiento anual (%) y pinta cada punto por su signo; por defecto la tasa anual ('valor', %)
function grafica(d, mm, campo = 'valor') {
  if (d.length < 2) return '<p class="mute">Sin datos suficientes.</p>';
  const ix = campo === 'indice' && d.every(p => p.indice != null);   // si el JSON aún no trae 'indice', vuelve a la tasa anual
  const vr = campo === 'var' && !mm;
  const val = p => ix ? p.indice : p.valor;
  const hace = p => ix ? p.indice_hace_12 : p.valor_hace_12;
  const dif = p => ix ? (p.indice_hace_12 == null ? null : p.indice - p.indice_hace_12) : p.var_anual_pp;
  const u = ix ? '' : ' %', ud = ix ? 'pts' : 'pp';
  const W = 520, H = matchMedia('(max-width:600px)').matches ? 190 : 250, L = mm ? 40 : 24, R = mm ? 40 : 24, T = 30, B = mm ? 58 : 34, paso = d.length > 13 ? Math.ceil(d.length / 8) : 1;
  const vs = d.map(val), mn = Math.min(...vs), mx = Math.max(...vs), pad = (mx - mn || 1) * .25;
  const x = i => L + i * (W - L - R) / (d.length - 1), y = v => T + (H - T - B) * (1 - (v - (mn - pad)) / (mx - mn + 2 * pad));
  const col = n => n > 0.004 ? 'var(--up-l)' : n < -0.004 ? 'var(--dn-l)' : 'var(--ink)';
  const colT = n => n > 0.004 ? 'var(--up-t)' : n < -0.004 ? 'var(--dn-t)' : 'var(--ink)';
  let seg = '', pts = '', lab = '';
  // 12 meses: si cada punto trae var_anual_pp (cambio vs. el mismo mes del año anterior), la línea va neutra y el color lo ponen los puntos
  const yoy = !mm && d.some(p => dif(p) != null);
  const zl = (mn - pad < 0 && mx + pad > 0) ? `<line x1="${L}" y1="${y(0)}" x2="${W - R}" y2="${y(0)}" stroke="#b8c6cd" stroke-width="1.5" stroke-dasharray="5 5"/><text x="${L}" y="${y(0) - 5}" font-size="12">0</text>` : '';
  d.forEach((p, i) => {
    if (i) seg += `<line x1="${x(i - 1)}" y1="${y(val(d[i - 1]))}" x2="${x(i)}" y2="${y(val(p))}" stroke="${yoy ? '#aebfc8' : val(p) > val(d[i - 1]) ? 'var(--up-l)' : 'var(--dn-l)'}" stroke-width="${yoy ? 3 : 3.5}" stroke-linecap="round"/>`;
    const ult = i === d.length - 1;
    const cp = (mm || vr) && p.valor != null ? col(p.valor) : yoy && dif(p) != null ? col(dif(p)) : null;
    const tip = yoy && hace(p) != null ? `<title>${esc(p.mes)} ${p.anio}: ${fmt(val(p))}${u} · hace un año: ${fmt(hace(p))}${u} (${sg(dif(p))} ${ud})</title>` : '';
    pts += `<circle cx="${x(i)}" cy="${y(val(p))}" r="${ult ? 7 : 4.5}" fill="${ult ? '#fff' : cp || 'var(--ink)'}" stroke="${ult ? cp || 'var(--acc)' : 'none'}" stroke-width="3.5">${tip}</circle>`;
    if (mm || vr || i === 0 || ult || val(p) === mx || val(p) === mn) {
      const bajo = vr && !ult && val(p) <= Math.min(i ? val(d[i - 1]) : Infinity, i < d.length - 1 ? val(d[i + 1]) : Infinity);   // mínimo local: la cifra va debajo del punto
      lab += `<text class="v" x="${x(i)}" y="${y(val(p)) + (bajo ? 22 : -12)}" text-anchor="${i === 0 ? 'start' : ult ? 'end' : 'middle'}"${vr ? ` style="fill:${colT(val(p))};font-size:14px"` : ''}>${fmt(val(p))}</text>`;
    }
    if ((d.length - 1 - i) % paso === 0) lab += `<text x="${x(i)}" y="${mm ? H - 30 : H - 8}" text-anchor="middle">${mm ? p.anio : esc(p.mes)}</text>`;
    if (mm && p.valor != null) lab += `<text class="v" x="${x(i)}" y="${H - 9}" text-anchor="middle" style="fill:${colT(p.valor)};font-size:15px">${sg(p.valor)} %</text>`;
  });
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Serie de ${mm ? 'años' : 'meses'}">${zl}${seg}${pts}${lab}</svg>`;
  const nota = t => `<p class="ref" style="margin:2px 0 0;font-size:13px">${t}</p>`;
  if (mm && d.some(p => p.valor != null)) return `<div class="gf">${svg}${nota('Cifra sobre cada punto: índice ISE · debajo del año: variación anual (frente al mismo mes del año anterior)')}</div>`;
  if (vr) return `<div class="gf">${svg}${nota('<span class="up">●</span> crecimiento anual positivo &nbsp; <span class="dn">●</span> negativo &nbsp; (cifras en %)')}</div>`;
  return yoy ? `<div class="gf">${svg}${nota('<span class="up">●</span> por encima del mismo mes del año anterior &nbsp; <span class="dn">●</span> por debajo')}</div>` : svg;
}

AV.init({
  ind: 'economia', title: 'Economía', docTitle: 'Economía', nacTitle: 'Total economía',
  deltaMes: D => D.hero.cambio_mes_pp,
  g: {dec: 2, unit: ' %', vf: 'var_anual_pp', vs: ' pp', calcMM: false},
  prevTitle: 'Crecimiento anual de meses anteriores · vs. hace un año',
  nota: 'Variaciones en pp = puntos porcentuales',
  esNac: x => /(^|_)nac(ional)?($|_)/i.test(x.tipo || '') || /^\s*(desempleo|inflaci[oó]n|costo de vida)\s+nacional\b/i.test(x.titulo || '') || /^\s*crecimiento de la econom[ií]a/i.test(x.titulo || ''),
  esVarMes: x => /(variacion|var)_(del_)?(mes|mensual)|^mensual$/i.test(x.tipo || '') || /^\s*variaci[oó]n\s+(del\s+)?mes\b/i.test(x.titulo || ''),
  nac: D => { const h = D.hero; return {ttl: 'Crecimiento de la economía', big: fmt(h.crecimiento_anual), unit: '%', bigCls: cls(h.crecimiento_anual), com: h.comentario_popular,
    filas: idx(h.indice) + (h.cambio_mes_pp != null ? vp('Vs. mes anterior', h.cambio_mes_pp, sg(h.cambio_mes_pp)) : '')}; },
  graf: (d, mm, ctx) => ctx === 'nac' ? grafica(d, mm, mm ? 'indice' : 'var') : grafica(d, mm),
  dims: {
    sec: {
      k: 'sectores', una: 'Sector', plural: 'Sectores', ning: 'Ningún sector', titulo: 'Por sector', medida: 'Crecimiento anual', kick: 'Crecimiento por sector',
      ref: D => ((D.dimensiones.sectores || {}).referencias || []).map(r => `${esc(r.nombre)}: ${fmt(r.var_anual)} %`).join(' · '),
      nom: x => nm(x.sector), val: x => x.var_anual, valTxt: x => fmt(x.var_anual) + ' %', vr: x => x.var_anual_pp,
      ord: (a, b) => a.puesto_anual - b.puesto_anual, serie: x => x.serie_12m, topSub: x => `hoy ${fmt(x.var_anual)} %`, top: true,
      topTxt: {up: 'aceleraron', dn: 'se desaceleraron', upS: 'aceleró', dnS: 'se desaceleró'},
      hero: x => ({ttl: nm(x.sector), big: fmt(x.var_anual), unit: '%', bigCls: cls(x.var_anual), com: x.comentario_popular, filas: filasEnt(x)}),
      // Las actividades del sector van en la pestaña "Actividades" del panel (ficha propia en celular)
      hijos: {label: 'Actividades', nota: 'Crecimiento anual de cada actividad; debajo, cambio frente a hace un año en pp (puntos porcentuales).',
        get: x => { const gs = [...(x.actividades || [])].sort((a, b) => b.var_anual - a.var_anual), mx = Math.max(...gs.map(g => Math.abs(g.var_anual)), .01);
          return gs.map(g => ({nombre: g.actividad, valTxt: fmt(g.var_anual) + ' %', val: g.var_anual, bar: g.var_anual, delta: g.var_anual_pp, sub: `${flecha(g.var_anual_pp)} ${sg(g.var_anual_pp)} pp`, w: 100 * Math.abs(g.var_anual) / mx})); }}
    },
    act: {
      k: 'actividades', una: 'Actividad', plural: 'Actividades', ning: 'Ninguna actividad', titulo: 'Por actividad', medida: 'Crecimiento anual', kick: 'Crecimiento por actividad',
      ref: D => ((D.dimensiones.actividades || {}).referencias || []).map(r => `${esc(r.nombre)}: ${fmt(r.var_anual)} %`).join(' · '),
      nom: x => x.actividad, sub: x => secTxt(x.sector), val: x => x.var_anual, valTxt: x => fmt(x.var_anual) + ' %', vr: x => x.var_anual_pp,
      ord: (a, b) => a.puesto_anual - b.puesto_anual, serie: x => x.serie_12m, topSub: x => `hoy ${fmt(x.var_anual)} %`, top: true,
      topTxt: {up: 'aceleraron', dn: 'se desaceleraron', upS: 'aceleró', dnS: 'se desaceleró'},
      hero: x => ({ttl: x.actividad, big: fmt(x.var_anual), unit: '%', bigCls: cls(x.var_anual), com: x.comentario_popular, extra: `Sector: ${esc(secTxt(x.sector))}`, filas: filasEnt(x)})
    }
  }
});
</script>
</body>
</html>
