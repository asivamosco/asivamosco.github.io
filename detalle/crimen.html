<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;600;700&family=Montserrat:wght@700;800&display=swap&family=Roboto+Condensed:wght@400;500;700" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/shell.css?v=26">
</head>
<body class="app det">
<header class="hd">
  <div class="hd-left">
    <h1 class="brand"><a class="home" href="../index.html" aria-label="Así Vamos, volver al inicio"><span class="brand-col"><span class="brand-txt" aria-hidden="true"><span class="b1">Así</span> <span class="b2">Vamos</span><svg class="brand-ico" viewBox="4 7 39.5 38.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="6" y="33" width="6.5" height="11"/><rect x="15" y="26" width="7" height="18"/><rect x="24.5" y="29" width="7.5" height="15"/><rect x="34.5" y="21" width="7" height="23"/><polyline points="8,21 18,14 28,18 38,11"/><g fill="#12303d"><circle cx="8" cy="21" r="2.8"/><circle cx="18" cy="14" r="2.8"/><circle cx="28" cy="18" r="2.8"/><circle cx="38" cy="11" r="2.8"/></g></svg></span><span class="brand-sub" aria-hidden="true">COLOMBIA</span></span></a></h1>
  </div>
  <div class="hd-title" id="hdTitle" aria-live="polite"></div>
  <nav class="hd-mid" aria-label="Vista">
    <button type="button" class="vt" data-vista="gen" aria-pressed="true">Total</button>
    <button type="button" class="vt" data-vista="dest" aria-pressed="false">Destacados</button>
    <button type="button" class="vt" data-vista="tem" aria-pressed="false">Delitos</button>
    <button type="button" class="vt" data-vista="dep" aria-pressed="false">Dptos</button>
    <button type="button" class="vt" data-vista="ciu" aria-pressed="false">Ciudades</button>
  </nav>
  <div class="hd-right">
    <div class="btn-group">
      <a class="help-btn" href="../index.html" aria-label="Volver al inicio" title="Inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h5v-6h3v6h5V10"/></svg></a>
    </div>
  </div>
</header>
<main id="app" aria-live="polite"><div class="card err mute">Cargando…</div></main>
<footer class="site-foot">
  <div class="foot-in">
    <div class="ad-wrap" id="adWrap">
      <div class="ad-label">Aliado estratégico</div>
      <div class="sp" id="adA"><span>Espacio publicitario</span></div>
    </div>
    <p class="foot-txt">Así Vamos © 2026 | Datos oficiales | asivamos.co@gmail.com</p>
  </div>
</footer>

<script src="asivamos.js"></script>
<script>
const {fmt, sg, cls, flecha, vp, esc} = AV;
// En crimen subir es lo malo (gris) y bajar lo bueno (ámbar): son los colores por defecto de shell.css para las páginas de detalle
const fm0 = n => fmt(n, 0);
const pct = (v, d = 2) => v == null ? '—' : sg(v, d) + ' %';
const celda = (l, t, c = '') => `<div><span class="mute">${l}</span><b${c ? ` class="${c}"` : ''}>${t}</b></div>`;
const TOP_REF = 'Variación porcentual de los casos frente al mismo mes de hace un año; debajo, el cambio en número de casos. Toca un delito, departamento o ciudad para ver su detalle.';

// Panel de un delito, departamento o ciudad
const heroEnt = (x, ciu) => ({
  ttl: x.nombre, big: fm0(x.cantidad), unit: 'casos', com: x.comentario_popular,
  extra: ciu && x.departamento ? `Departamento: ${esc(x.departamento)}` : '',
  filas: vp('Vs. hace un año', x.var_anual_pct, pct(x.var_anual_pct))
    + celda('Hace un año', fm0(x.cantidad_hace_12))
    + celda('Diferencia en casos', `${flecha(x.diferencia)} ${sg(x.diferencia, 0)}`, cls(x.diferencia))
    + celda('Del total nacional', `${fmt(x.participacion_pct, 1)} %`)});

// Hijos de la entidad elegida (delito -> departamentos; departamento y ciudad -> delitos), ordenados por casos; la barra es su peso dentro de la entidad
const hijosGet = x => { const hs = [...(x.hijos || [])].sort((a, b) => b.cantidad - a.cantidad), mx = Math.max(...hs.map(h => h.participacion_pct || 0), .01);
  return hs.map(h => ({nombre: h.nombre, valTxt: fm0(h.cantidad), delta: h.var_anual_pct,
    sub: `${flecha(h.var_anual_pct)} ${h.var_anual_pct == null ? 'nuevo' : sg(h.var_anual_pct, 1) + ' %'}`, w: 100 * (h.participacion_pct || 0) / mx})); };
const hijos = label => ({label, get: hijosGet, nota: d => `Casos del mes; debajo, variación frente a hace un año. La barra muestra su peso dentro de ${esc(d.nombre)}.`});

// Campos comunes de delitos, departamentos y ciudades
const base = k => ({
  k, medida: 'Casos del mes', ref: D => (((D.dimensiones || {})[k] || {}).referencias || []).map(r => `${esc(r.nombre)}: ${sg(r.var_anual_pct)} % en casos`).join(' · '),
  nom: x => x.nombre, val: x => x.cantidad, valTxt: x => fm0(x.cantidad), vr: x => x.var_anual_pct,
  ord: (a, b) => a.puesto_cantidad - b.puesto_cantidad, serie: x => x.serie_12m,
  topSub: x => `${sg(x.diferencia, 0)} casos`, top: true, topRef: TOP_REF,
  topTxt: {upS: 'aumentó sus casos', dnS: 'redujo sus casos'},
  nuevos: {txt: x => `${fm0(x.cantidad)} casos`}
});

AV.init({
  ind: 'crimen', title: 'Criminalidad', docTitle: 'Criminalidad', nacTitle: 'Índice de criminalidad',
  deltaMes: D => D.hero.var_mensual_pct,
  // El índice se grafica con 2 decimales; los casos de cada delito, departamento o ciudad con 0
  g: {dec: (d, ctx) => ctx === 'ent' ? 0 : 2, unit: ctx => ctx === 'ent' ? ' casos' : '', vd: 1, vs: ' %', vf: 'var_anual_pct', nulo: 'nuevo', calcMM: false, mmNota: 'Cifra sobre cada punto: índice del mes · debajo del año: variación frente al mismo mes del año anterior'},
  prevTitle: 'Índice de meses anteriores · vs. hace un año',
  tit: {ent: 'Casos por mes: últimos 12 meses'},
  // El índice nacional no va en Destacados (ya está en el panel)
  esNac: x => /(^|_)nac(ional)?($|_)/i.test(x.tipo || '') || /^\s*[ií]ndice de criminalidad/i.test(x.titulo || ''),
  esVarMes: x => /(variacion|var)_(del_)?(mes|mensual)|^mensual$/i.test(x.tipo || '') || /^\s*variaci[oó]n\s+(del\s+)?mes\b/i.test(x.titulo || ''),
  nac: D => { const h = D.hero; return {ttl: 'Índice de criminalidad', big: fmt(h.indice), com: h.comentario_popular,
    extra: h.indice_hace_12 != null ? `Índice hace un año: ${fmt(h.indice_hace_12)}` : '',
    filas: vp('Vs. hace un año', h.var_anual_pct, pct(h.var_anual_pct)) + vp('Vs. mes anterior', h.var_mensual_pct, pct(h.var_mensual_pct))
      + celda('Casos del mes', fm0(h.casos)) + celda('Casos hace un año', fm0(h.casos_hace_12))}; },
  dims: {
    tem: {...base('tematicas'), una: 'Delito', plural: 'Delitos', ning: 'Ningún delito', titulo: 'Por delito', kick: 'Casos por delito',
      hero: x => heroEnt(x, false), hijos: hijos('Departamentos')},
    dep: {...base('departamentos'), una: 'Departamento', plural: 'Departamentos', ning: 'Ningún departamento', titulo: 'Por departamento', kick: 'Casos por departamento',
      hero: x => heroEnt(x, false), hijos: hijos('Delitos')},
    ciu: {...base('ciudades'), una: 'Ciudad', plural: 'Ciudades', ning: 'Ninguna ciudad', titulo: 'Por ciudad', kick: 'Casos por ciudad',
      sub: x => x.departamento, hero: x => heroEnt(x, true), hijos: hijos('Delitos')}
  }
});
</script>
</body>
</html>
