<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detalle · Así Vamos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;600;700&family=Montserrat:wght@700;800&display=swap&family=Roboto+Condensed:wght@400;500;700" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/shell.css?v=2">
<style>
:root{
  --bg:#e9ebef; --card:#fff; --ink:#12303d; --mute:#6f8695; --line:#e1e7ea;
  --acc:#0f6b7a; --up:#e8553d; --dn:#14b8a6; --up-l:#e8553d; --dn-l:#14b8a6;
  --mal:#e8553d; --ok:#14b8a6; --up-t:#c4412b; --dn-t:#0b8577;
  --r:6px; --sh:0 1px 2px rgba(18,48,61,.06),0 10px 26px rgba(18,48,61,.09);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 "Roboto Condensed",system-ui,sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.up{color:var(--up)} .dn{color:var(--dn)}
/* texto pequeño: variante más oscura para legibilidad sobre blanco (los números grandes quedan con el color vivo) */
.vr.up,.row2 .up{color:var(--up-t)} .vr.dn,.row2 .dn{color:var(--dn-t)}
a,button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* Header y footer: mismo estilo del index (petróleo, a todo el ancho; contenido alineado con la columna de 960 px) */
header.hd{--hd-acc:#cfe3ea;position:sticky;top:0;z-index:20}
.hd-left{flex:1 1 0}
.hd-right{flex:none}
.hd-mid{flex:none;display:flex;align-items:flex-end;align-self:flex-end;gap:6px;padding:0 12px}
header.hd .vt{border:0;border-radius:10px 10px 0 0;background:rgba(255,255,255,.1);color:var(--hd-acc);padding:12px 22px 11px;
  font-family:Montserrat,"Segoe UI",sans-serif;font-size:13px;font-weight:700;letter-spacing:.02em;line-height:1;white-space:nowrap;cursor:pointer;transition:background .15s,color .15s}
header.hd .vt:hover{background:rgba(255,255,255,.22);color:#fff}
header.hd .vt[aria-pressed=true]{background:var(--bg);color:var(--ink)}
header.hd .vt:focus-visible{outline:2px solid #fff;outline-offset:-2px}
@media(max-width:600px){
  header.hd{flex-wrap:wrap}
  .hd-mid{order:3;flex:0 0 100%;justify-content:center;padding:0 10px}
  header.hd .vt{padding:10px 18px 9px;font-size:12px}
}
/* Celular y tablet en vertical: las tabs cuelgan del borde inferior del header, unidas en una sola tira separada por una línea fina, todas del mismo ancho */
@media(max-width:1024px) and (orientation:portrait){
  header.hd{margin-bottom:35px}
  .hd-mid{position:absolute;top:100%;left:0;right:0;margin:0 auto;order:0;flex:none;width:calc(100% - 2*var(--gutter));max-width:var(--col);height:35px;align-self:auto;align-items:flex-start;justify-content:center;gap:0;padding:0;background:transparent;pointer-events:none}
  header.hd .vt{pointer-events:auto;flex:1 1 0;min-width:0;border-radius:0;padding:10px 4px 12px;font-size:12px;background:#2d4756;color:#cfe3ea;border-top:1px solid rgba(255,255,255,.22);border-left:1px solid rgba(255,255,255,.22);overflow:hidden;text-overflow:ellipsis}
  header.hd .vt:first-child{border-left:0;border-bottom-left-radius:10px}
  header.hd .vt:last-child{border-bottom-right-radius:10px}
  header.hd .vt:hover{background:#3a5a6b;color:#fff}
  header.hd .vt[aria-pressed=true]{background:#12303d;color:#fff}
}
/* main ocupa todo el ancho (el scroll queda en el borde de la pantalla); el contenido se centra en --col con padding */
main{width:100%;max-width:none;margin:0;padding:20px max(var(--gutter),calc((100% - var(--col))/2)) 24px;display:grid;gap:18px;align-content:start}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;position:relative}
.card h2{margin:0 0 12px;font-size:19px;font-weight:700}
.badge{position:absolute;top:-10px;right:14px;background:#dde5ea;color:#3f5563;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px}
.mute{color:var(--mute)} small{font-size:13px}
/* hero (card pequeña, cambia con la selección) */
.hero{display:flex;flex-direction:column;gap:8px}
.hero .kick{font-size:14px;color:var(--mute);line-height:1.2}
.hero .ttl{font-size:20px;font-weight:700;line-height:1.2}
.hero .big{font-size:64px;font-weight:700;line-height:1;letter-spacing:-1px;margin:2px 0 4px}
.hero .big span{font-size:26px;margin-left:4px;color:var(--mute)}
.vars{display:grid;gap:10px}
/* etiqueta arriba, cifra debajo: el texto no se comprime junto a la cifra */
.vars div{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border-bottom:1px solid var(--line);padding-bottom:8px}
.vars span{font-size:13px;line-height:1.2}
.vars b{font-size:20px;line-height:1.1;white-space:nowrap}
.hero .src{margin-top:auto;font-size:12.5px;line-height:1.3}
/* hallazgos */
.hz{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.hz .card{padding:14px 16px;border-left:4px solid var(--acc)}
.hz .card.sube{border-left-color:var(--up-l)} .hz .card.baja{border-left-color:var(--dn-l)}
.hz h3{margin:0 0 4px;font-size:15px;color:var(--mute);font-weight:500}
.hz p{margin:0;font-size:17px}
/* sexo */
.sx{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.sx button{all:unset;cursor:pointer;display:block;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r)}
.sx button:focus-visible{outline:2px solid var(--acc)}
.sx button[aria-pressed=true]{border-color:var(--acc);background:#eef6f7}
.sx .n{font-size:15px;color:var(--mute)} .sx .t{font-size:40px;font-weight:700;line-height:1.1}
.sx .row2{display:flex;justify-content:space-between;margin-top:6px}
.brecha{margin:12px 0 0;font-size:17px}
.sxc .ref{margin:6px 0 0;font-size:13px}
/* ciudades */
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.head h2{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 14px;cursor:pointer;font-weight:500}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.list{display:grid;align-content:start}
.row{all:unset;cursor:pointer;display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 8px;border-top:1px solid #fff;background:rgba(232,85,61,var(--a,.1))}
.row:hover{filter:brightness(.95)} .row[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--ink)}
.row .vl{display:block}
.row:focus-visible{outline:2px solid var(--acc)}
.rk{color:var(--mute);text-align:right;font-size:14px}
.nm{display:grid;gap:5px;min-width:0}
.nm>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:block;height:6px;background:#e6ecef;border-radius:3px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.vl{text-align:right;display:grid} .vl strong{font-size:19px;line-height:1.1}
.vr{text-align:right;font-size:15px;font-weight:500}
.ref{margin:10px 0 0;font-size:14px;color:var(--mute)}
/* bloque superior (3 columnas). General: gráfica (2) + indicador (1). Ciudades: lista (1, alta) + gráfica (2) y debajo el indicador en franja */
.top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:auto;gap:14px;scroll-margin-top:84px}
.top>.card{display:flex;flex-direction:column;min-width:0}
.cg{grid-column:2/4;grid-row:1;min-height:300px}
.top>.hero{grid-column:3;grid-row:1}
.top.g .cg{grid-column:1/3}
.cl{grid-column:1;grid-row:1/3;contain:size;min-height:460px;padding:14px 12px}
.top:not(.g)>.hero{grid-column:2/4;grid-row:2;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"kick kick" "ttl ttl" "big vars" "src src";column-gap:20px;row-gap:6px;align-content:start}
.top:not(.g)>.hero .kick{grid-area:kick}.top:not(.g)>.hero .ttl{grid-area:ttl}.top:not(.g)>.hero .big{grid-area:big}
.top:not(.g)>.hero .vars{grid-area:vars;grid-template-columns:1fr 1fr;gap:12px 16px;align-content:center;align-self:center}
.top:not(.g)>.hero .ttl{font-size:22px}
.top:not(.g)>.hero .big{align-self:center;margin:0}
.top:not(.g)>.hero .src{grid-area:src;margin-top:6px}
.cl .head h2{font-size:17px}
.cl .seg button{padding:4px 10px;font-size:14px}
.cl .list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.cl .vl strong{font-size:17px}
.cl .ref{margin:8px 0 0;font-size:13px;line-height:1.3}
.cg #chart{flex:1;display:flex;align-items:center}
.cg #chart>*{width:100%}
.sub2{margin:18px 0 4px;font-size:16px;font-weight:700}
.cg .hz .card{box-shadow:none;background:#f6f8f9}
.cg .hz{align-self:flex-start}
/* TOP: listas completas, los nombres largos pueden ocupar dos líneas */
.t5 .nm>span:first-child{white-space:normal;overflow:visible}
.t5 h2 small{font-size:14px;font-weight:500}
#app>.tabs{margin:0}
/* top 5 cambio anual */
.tres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.tres>.sxc{grid-column:1/-1}
.t5 h2.up{color:var(--up-t)} .t5 h2.dn{color:var(--dn-t)}
.tr{all:unset;cursor:pointer;display:grid;grid-template-columns:22px 1fr auto;gap:4px 10px;align-items:center;padding:9px 6px;border-top:1px solid var(--line);width:calc(100% - 12px)}
.tr:hover{background:#f4f7f8} .tr[aria-pressed=true]{background:#e8f3f5}
.tr:focus-visible{outline:2px solid var(--acc)}
.tr .bar b.up{background:var(--up)} .tr .bar b.dn{background:var(--dn)}
.tr .vl strong.up{color:var(--up-t)} .tr .vl strong.dn{color:var(--dn-t)}
.t5 .vacio{margin:0;padding:12px 6px;border-top:1px solid var(--line);color:var(--mute);font-size:15px}
/* serie */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 14px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
svg{width:100%;height:auto;display:block}
svg text{font-family:inherit;fill:var(--mute);font-size:15px}
svg text.v{fill:var(--ink);font-weight:700;font-size:16px}
.err{padding:24px;text-align:center}
@media(max-width:600px){
  .top{grid-template-columns:1fr}
  .top>.card,.top .cg,.top.g .cg,.top>.hero,.top:not(.g)>.hero{grid-column:1;grid-row:auto}
  .top:not(.g)>.hero{display:flex}
  .top:not(.g)>.hero .vars{grid-template-columns:1fr}
  .cl{contain:none;height:340px;min-height:0}
  .tres{grid-template-columns:1fr}
}
@media(max-width:420px){.hz{grid-template-columns:1fr}}
/* divisiones de gasto */
.sx{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.sx .n{line-height:1.2;min-height:2.4em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sx .t{font-size:34px}.sx .row2{gap:8px;font-size:14px}
.gt{margin:18px 0 4px;font-size:16px;font-weight:700}
.tr.g{cursor:default;width:100%}
.hero.wt{grid-template-areas:"kick tabs" "ttl ttl" "big vars" "src src"!important}
.hero.wt.gr{grid-template-areas:"kick tabs" "ttl ttl" "gl gl"!important}
.hero .htabs{grid-area:tabs;justify-self:end;margin:0}
.hero .htabs button{padding:3px 12px;font-size:14px}
.gwrap{grid-area:gl;min-width:0}
.glist{max-height:250px;overflow-y:auto;overscroll-behavior:contain;border-bottom:1px solid var(--line)}
.glist .tr:first-child{border-top:0}
.gwrap .ref{margin:6px 0 0;font-size:13px}.tr.g:hover{background:none}
.tr.g .wrap{white-space:normal;overflow:visible}
.tr .bar b.up{background:var(--up)}.tr .bar b.dn{background:var(--dn)}
.hero .src{line-height:1.35}
/* Celular: la lista de ciudades / divisiones se presenta como select */
@media(max-width:600px){
  .cl .list{display:none}
  .cl{height:auto;min-height:0}
}
</style>
</head>
<body class="app">
<header class="hd">
  <div class="hd-left">
    <h1 class="brand"><a class="home" href="../index.html" aria-label="Así Vamos, volver al inicio"><span class="brand-col"><span class="brand-txt" aria-hidden="true"><span class="b1">Así</span> <span class="b2">Vamos</span><svg class="brand-ico" viewBox="4 7 39.5 38.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="6" y="33" width="6.5" height="11"/><rect x="15" y="26" width="7" height="18"/><rect x="24.5" y="29" width="7.5" height="15"/><rect x="34.5" y="21" width="7" height="23"/><polyline points="8,21 18,14 28,18 38,11"/><g fill="#12303d"><circle cx="8" cy="21" r="2.8"/><circle cx="18" cy="14" r="2.8"/><circle cx="28" cy="18" r="2.8"/><circle cx="38" cy="11" r="2.8"/></g></svg></span><span class="brand-sub" aria-hidden="true">COLOMBIA</span></span></a></h1>
  </div>
  <div class="hd-title" id="hdTitle" aria-live="polite"></div>
  <nav class="hd-mid" aria-label="Vista">
    <button type="button" class="vt" data-vista="gen" aria-pressed="true">General</button>
    <button type="button" class="vt" data-vista="top" aria-pressed="false">TOP</button>
    <button type="button" class="vt" data-vista="div" aria-pressed="false">Divisiones</button>
    <button type="button" class="vt" data-vista="ciu" aria-pressed="false">Ciudades</button>
  </nav>
  <div class="hd-right">
    <div class="btn-group">
      <a class="help-btn" href="../index.html" aria-label="Volver al inicio" title="Inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h5v-6h3v6h5V10"/></svg></a>
    </div>
  </div>
</header>
<main id="app" aria-live="polite"><div class="card err mute">Cargando…</div></main>
<footer class="site-foot">
  <div class="foot-in">
    <div class="ad-wrap" id="adWrap">
      <div class="ad-label">Aliado estratégico</div>
      <div class="sp" id="adA"><span>Espacio publicitario</span></div>
    </div>
    <p class="foot-txt">Así Vamos © 2026 | Datos oficiales | asivamos.co@gmail.com</p>
  </div>
</footer>

<script>
const IND = new URLSearchParams(location.search).get('ind') || 'inflacion';
const URL_JSON = `data/detalle_${IND}.json`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (n, d = 2) => n == null ? '—' : Number(n).toLocaleString('es-CO', {minimumFractionDigits: d, maximumFractionDigits: d});
const sg  = (n, d = 2) => n == null ? '—' : (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n), d);
// Nombres del DANE vienen en Title Case ("Restaurantes Y Hoteles"): se pasan a formato de oración
const nm = s => String(s ?? '').replace(/\b(Y|De|Del|La|El|Los|Las|Para|Por|En|Con|A|O)\b/g, (m, _, o) => o ? m.toLowerCase() : m);
// En inflación, subir es lo malo (rojo) y bajar lo bueno (verde)
const cls = n => n == null || Math.abs(n) < 0.005 ? '' : n > 0 ? 'up' : 'dn';
const flecha = n => n == null || Math.abs(n) < 0.005 ? '■' : n > 0 ? '▲' : '▼';

// vista: 'gen' (nacional) | 'div' (divisiones de gasto) | 'ciu' (ciudades). c = ciudad elegida; dv = división elegida.
let D, st = {vista: 'gen', g: null, c: null, dv: null, tab: 'doce', htab: 'div', gtab: 'graf', ttab: 'ciu'};
const nacional = () => ({nombre: 'Nacional', datos: D.serie.doce_meses, nac: true, tipo: 'nac'});
const ciudadSerie = c => ({nombre: c.ciudad, datos: c.serie_12m, tipo: 'ciudad', d: c});
const divSerie = s => ({nombre: nm(s.division), datos: s.serie_12m, tipo: 'div', d: s});
const cur = () => st.vista === 'gen' ? st.g : st.vista === 'div' ? st.dv : st.c;

fetch(URL_JSON, {cache: 'no-store'}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    D = d; st.g = nacional();
    const primera = [...d.dimensiones.ciudades.items].sort((a, b) => a.puesto_tasa - b.puesto_tasa)[0];
    st.c = primera ? ciudadSerie(primera) : null;
    const pd = [...d.dimensiones.divisiones.items].sort((a, b) => a.puesto_anual - b.puesto_anual)[0];
    st.dv = pd ? divSerie(pd) : null;
    render();
  })
  .catch(() => { $('#app').innerHTML = `<div class="card err">No se pudo cargar <b>${esc(URL_JSON)}</b>.<br><span class="mute">Genera el archivo con el backend (kpi.vw_inflacion_detalle → campo detalle) y publícalo en la carpeta data/ junto a esta página (si abres el HTML desde el disco, el navegador bloquea la lectura: usa un servidor local).</span></div>`; });

// Título del header: "<indicador> - <mes>", el mes sale de periodo (JSON)
function tituloHeader(nombre) {
  const p = D && D.periodo || {};
  const norm = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const busca = t => (norm(t).match(/\b(ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic)[a-z]*\b/) || [])[1];
  const m = busca(p.mes_nombre) || busca(p.etiqueta);
  $('#hdTitle').textContent = m ? `${nombre} - ${m[0].toUpperCase()}${m.slice(1)}` : nombre;
}

function render() {
  document.title = 'Inflación · Así Vamos';
  tituloHeader('Costo de Vida');
  const dim = D.dimensiones, ciu = dim.ciudades, gen = st.vista === 'gen';
  document.querySelectorAll('[data-vista]').forEach(b => {
    b.setAttribute('aria-pressed', b.dataset.vista === st.vista);
    if (b.dataset.vista === 'ciu') b.textContent = 'Ciudades';
  });

  if (gen) {
    $('#app').innerHTML = `
    <div class="top g" id="top">
      <section class="card cg" aria-label="Serie">
        <div class="head"><h2 id="serieT"></h2><div class="tabs" id="tabs"></div></div>
        <div id="chart"></div>
      </section>
      <section class="card hero" id="hero" aria-label="Indicador"></section>
    </div>`;
  } else if (st.vista === 'top') {
    $('#app').innerHTML = `
    <div class="tabs" role="group" aria-label="Ver por">
      <button data-ttab="ciu" aria-pressed="${st.ttab === 'ciu'}">Ciudades</button>
      <button data-ttab="div" aria-pressed="${st.ttab === 'div'}">Divisiones</button>
    </div>
    <div class="tres">
      <section class="card t5" id="t5s" aria-label="Aumentaron"></section>
      <section class="card t5" id="t5b" aria-label="Redujeron"></section>
    </div>
    <p class="ref" style="margin:-6px 0 0">pp = puntos porcentuales: cambio de la inflación anual frente a hace un año, por ciudad y por división de gasto. Toca una ciudad o una división para ver su detalle.</p>`;
    top5();
  } else if (st.vista === 'div') {
    $('#app').innerHTML = `
    <div class="top" id="top">
      <section class="card cl" aria-label="Por división">
        <div class="head"><h2>Por división</h2><small class="mute">Inflación anual</small></div>
        <select class="selL" id="selLista" aria-label="Elegir"></select>
        <div class="list" id="lista"></div>
        <div class="clfoot"><small class="mute clm">Inflación anual</small><p class="ref">Total nacional: ${fmt(D.hero.tasa_inflacion)} %</p></div>
      </section>
      <section class="card cg" aria-label="Serie">
        <div class="head"><h2 id="serieT"></h2><div class="tabs" id="tabs"></div></div>
        <div id="chart"></div>
      </section>
      <section class="card hero" id="hero" aria-label="Indicador"></section>
    </div>`;
    listaDiv();
  } else {
    $('#app').innerHTML = `
    <div class="top" id="top">
      <section class="card cl" aria-label="Por ciudad">
        <div class="head"><h2>Por ciudad</h2><small class="mute">Inflación anual</small></div>
        <select class="selL" id="selLista" aria-label="Elegir"></select>
        <div class="list" id="lista"></div>
        <div class="clfoot"><small class="mute clm">Inflación anual</small><p class="ref">${refTxt(ciu.referencias)}</p></div>
      </section>
      <section class="card cg" aria-label="Serie">
        <div class="head"><h2 id="serieT"></h2><div class="tabs" id="tabs"></div></div>
        <div id="chart"></div>
      </section>
      <section class="card hero" id="hero" aria-label="Indicador"></section>
    </div>`;
    lista();
  }
  if (st.vista !== 'top') { hero(); serie(); }
}

function refTxt(refs) {
  const n = (refs || []).filter(r => /nacional/i.test(r.nombre));
  return (n.length ? n : (refs || [])).map(r => `${esc(r.nombre)}: ${fmt(r.var_anual)} %`).join(' · ');
}

// Card de indicador: nacional por defecto; cambia con la ciudad o la división elegidas
function hero() {
  const s = cur(), h = D.hero, per = D.periodo, d = s.d;
  let kick = '', ttl = 'Inflación nacional', tasa = h.tasa_inflacion, com = h.comentario_popular, src = `${per.etiqueta} · Fuente: ${D.fuente}`;
  const pp = (l, v) => `<div><span class="mute">${l}</span><b class="${cls(v)}">${flecha(v)} ${sg(v)}</b></div>`;
  let filas;
  if (s.tipo === 'nac') {
    filas = `<div><span class="mute">Variación del mes</span><b>${fmt(h.variacion_mensual)} %</b></div>`
      + `<div><span class="mute">Mismo mes, año anterior</span><b>${fmt(h.variacion_mensual_hace_un_ano)} %</b></div>`
      + pp('Vs. mes anterior', h.cambio_mes_pp) + pp('Vs. hace un año', h.var_anual_pp);
  } else {
    kick = s.tipo === 'ciudad' ? 'Inflación por ciudad' : 'Inflación por división de gasto';
    ttl = s.nombre; tasa = d.var_anual; com = d.comentario_popular;
    const br = s.tipo === 'ciudad' ? d.brecha_vs_nacional : d.brecha_vs_total;
    filas = `<div><span class="mute">Variación del mes</span><b>${fmt(d.var_mensual)} %</b></div>`
      + pp('Vs. mes anterior', d.cambio_mes_pp) + pp('Vs. hace un año', d.var_anual_pp)
      + `<div><span class="mute">Frente al total nacional</span><b class="${cls(br)}">${flecha(br)} ${sg(br)}</b></div>`;
  }
  const enDiv = s.tipo === 'div', gr = enDiv && st.htab === 'grupos';
  $('#hero').className = 'card hero' + (enDiv ? ' wt' + (gr ? ' gr' : '') : '');
  const tabsH = enDiv ? `<div class="tabs htabs" role="group" aria-label="Contenido del panel">
      <button data-htab="div" aria-pressed="${!gr}">División</button>
      <button data-htab="grupos" aria-pressed="${gr}">Grupos${(d.grupos || []).length ? ` (${d.grupos.length})` : ''}</button></div>` : '';
  const cuerpo = gr ? gruposHtml(d) : `<div class="big">${fmt(tasa)}<span>%</span></div>
    <div class="vars">${filas}</div>
    <small class="mute src">${com ? esc(com) + '<br>' : ''}${esc(src)}<br>Variaciones en pp = puntos porcentuales</small>`;
  $('#hero').innerHTML = `${kick ? `<div class="kick">${esc(kick)}</div>` : ''}${tabsH}
    <div class="ttl">${esc(ttl)}</div>${cuerpo}`;
}

// Actualiza el resaltado de la selección sin reconstruir la lista (conserva scroll y foco)
function marcar() {
  const dim = D.dimensiones;
  const sl = $('#selLista');
  if (st.vista === 'ciu') {
    document.querySelectorAll('[data-ci]').forEach(x => x.setAttribute('aria-pressed', dim.ciudades.items[x.dataset.ci].ciudad === st.c.nombre));
    if (sl) sl.value = dim.ciudades.items.findIndex(c => c.ciudad === st.c.nombre);
  } else if (st.vista === 'div') {
    document.querySelectorAll('[data-dv]').forEach(x => x.setAttribute('aria-pressed', dim.divisiones.items[x.dataset.dv] === st.dv.d));
    if (sl) sl.value = dim.divisiones.items.indexOf(st.dv.d);
  }
}

// Grupos de la división elegida (van dentro del panel; con scroll si la lista es larga)
function gruposHtml(d) {
  const gs = [...(d.grupos || [])].sort((a, b) => b.var_anual - a.var_anual), mx = Math.max(...gs.map(g => Math.abs(g.var_anual)), 0.01);
  if (!gs.length) return '<div class="gwrap"><p class="vacio">Esta división no tiene grupos.</p></div>';
  return `<div class="gwrap"><div class="glist" tabindex="0" aria-label="Grupos de la división">${gs.map((g, i) => `
    <div class="tr g">
      <span class="rk">${i + 1}</span>
      <span class="nm"><span class="wrap">${esc(nm(g.grupo))}</span><span class="bar"><b class="${cls(g.var_anual_pp)}" style="width:${100 * Math.abs(g.var_anual) / mx}%"></b></span></span>
      <span class="vl"><strong>${fmt(g.var_anual)} %</strong>
        <small class="${cls(g.var_anual_pp)}">${flecha(g.var_anual_pp)} ${sg(g.var_anual_pp)} pp</small></span></div>`).join('')}</div>
    <p class="ref">Variación anual de cada grupo; debajo, cambio frente a hace un año en pp (puntos porcentuales).</p></div>`;
}

function listaDiv() {
  const items = [...D.dimensiones.divisiones.items].sort((a, b) => a.puesto_anual - b.puesto_anual);
  const ts = items.map(c => c.var_anual || 0), mx = Math.max(...ts), mn = Math.min(...ts);
  const l = $('#lista');
  l.innerHTML = items.map((c, i) => {
    const a = .08 + .52 * ((c.var_anual || 0) - mn) / ((mx - mn) || 1);
    return `<button class="row" style="--a:${a.toFixed(2)}" data-dv="${D.dimensiones.divisiones.items.indexOf(c)}" title="${esc(nm(c.division))}" aria-pressed="${st.dv.d === c}">
      <span class="rk">${i + 1}</span>
      <span class="nm"><span>${esc(nm(c.division))}</span></span>
      <span class="vl"><strong>${fmt(c.var_anual)} %</strong></span></button>`;
  }).join('');
  const r = l.querySelector('[aria-pressed=true]');
  if (r) l.scrollTop = Math.max(0, r.offsetTop - l.offsetTop - (l.clientHeight - r.offsetHeight) / 2);
  const sl = $('#selLista');
  sl.setAttribute('aria-label', 'Elegir división');
  sl.innerHTML = items.map((c, i) => `<option value="${D.dimensiones.divisiones.items.indexOf(c)}"${st.dv.d === c ? ' selected' : ''}>${fmt(c.var_anual)} % · ${esc(nm(c.division))}</option>`).join('');
}

function lista() {
  const items = [...D.dimensiones.ciudades.items].sort((a, b) => a.puesto_tasa - b.puesto_tasa);
  const ts = items.map(c => c.var_anual || 0), mx = Math.max(...ts), mn = Math.min(...ts);
  const l = $('#lista');
  l.innerHTML = items.map((c, i) => {
    const a = .08 + .52 * ((c.var_anual || 0) - mn) / ((mx - mn) || 1);
    return `<button class="row" style="--a:${a.toFixed(2)}" data-ci="${D.dimensiones.ciudades.items.indexOf(c)}" title="${esc(c.ciudad)}" aria-pressed="${st.c.nombre === c.ciudad}">
      <span class="rk">${i + 1}</span>
      <span class="nm"><span>${esc(c.ciudad)}</span></span>
      <span class="vl"><strong>${fmt(c.var_anual)} %</strong></span></button>`;
  }).join('');
  const r = l.querySelector('[aria-pressed=true]');
  if (r) l.scrollTop = Math.max(0, r.offsetTop - l.offsetTop - (l.clientHeight - r.offsetHeight) / 2);
  const sl = $('#selLista');
  sl.setAttribute('aria-label', 'Elegir ciudad');
  sl.innerHTML = items.map((c, i) => `<option value="${D.dimensiones.ciudades.items.indexOf(c)}"${st.c.nombre === c.ciudad ? ' selected' : ''}>${fmt(c.var_anual)} % · ${esc(c.ciudad)}</option>`).join('');
}

// Top 5 que más subieron / bajaron en inflación anual (pp vs. hace un año), por ciudad y por división
function top5() {
  const dim = D.dimensiones;
  const bloque = (tit, todas, nom, attr, k, vacio) => {
    const items = todas.filter(c => c.var_anual_pp != null);
    const arr = (k === 'up' ? items.filter(c => c.var_anual_pp > 0).sort((a, b) => b.var_anual_pp - a.var_anual_pp)
                            : items.filter(c => c.var_anual_pp < 0).sort((a, b) => a.var_anual_pp - b.var_anual_pp));
    const mx = Math.max(...items.map(c => Math.abs(c.var_anual_pp)), 0.01);
    return `<h2 class="${k}">${tit} <small>(${arr.length})</small></h2>${arr.length ? arr.map((c, i) => `
    <button class="tr" ${attr}="${todas.indexOf(c)}" title="${esc(nom(c))}" aria-pressed="false">
      <span class="rk">${i + 1}</span>
      <span class="nm"><span>${esc(nom(c))}</span><span class="bar"><b class="${k}" style="width:${100 * Math.abs(c.var_anual_pp) / mx}%"></b></span></span>
      <span class="vl"><strong class="${k}">${flecha(c.var_anual_pp)} ${sg(c.var_anual_pp)}</strong>
        <small class="mute">hoy ${fmt(c.var_anual)} %</small></span></button>`).join('') : `<p class="vacio">${vacio}</p>`}`;
  };
  const nc = c => c.ciudad, nd = c => nm(c.division);
  const ciu = st.ttab === 'ciu';
  const todas = ciu ? dim.ciudades.items : dim.divisiones.items, nomf = ciu ? nc : nd, attr = ciu ? 'data-ci' : 'data-dv';
  const et = ciu ? 'Ciudades' : 'Divisiones', ning = ciu ? 'Ninguna ciudad' : 'Ninguna división';
  $('#t5s').innerHTML = bloque(`${et} que aumentaron`, todas, nomf, attr, 'up', `${ning} aumentó frente a hace un año.`);
  $('#t5b').innerHTML = bloque(`${et} que redujeron`, todas, nomf, attr, 'dn', `${ning} redujo frente a hace un año.`);
}

function serie() {
  const s = cur(), dest = s.nac && st.gtab === 'dest';
  $('#serieT').textContent = dest ? `${s.nombre}: destacados` : `${s.nombre}: últimos 12 meses`;
  // Nacional: pestañas Gráficas / Destacados
  $('#tabs').innerHTML = s.nac
    ? `<button data-gtab="graf" aria-pressed="${!dest}">Gráficas</button><button data-gtab="dest" aria-pressed="${dest}">Destacados</button>`
    : '';
  $('#chart').innerHTML = dest ? hallazgosHtml()
    : s.nac
    ? `<div class="dos">${grafica(s.datos || [], false)}<h3 class="sub2">Mismo mes por año</h3>${grafica(D.serie.mismo_mes || [], true)}</div>`
    : grafica(s.datos || [], false);
}

// Paneles de hallazgos (antes en TOP); ahora dentro de General, pestaña Destacados
function hallazgosHtml() {
  return `<div class="hz">${(D.hallazgos || []).map(x => `
    <div class="card ${/_alta$/.test(x.tipo) ? 'sube' : /_baja$/.test(x.tipo) ? 'baja' : ''}">
      <h3>${esc(x.titulo)}</h3><p>${esc(nm(x.texto))}</p></div>`).join('')}</div>`;
}

function grafica(d, mm) {
  if (d.length < 2) return '<p class="mute">Sin datos suficientes.</p>';
  const W = 520, H = 250, L = 24, R = 24, T = 30, B = 34, paso = d.length > 13 ? Math.ceil(d.length / 8) : 1;
  const vs = d.map(p => p.valor), mn = Math.min(...vs), mx = Math.max(...vs), pad = (mx - mn || 1) * .25;
  const x = i => L + i * (W - L - R) / (d.length - 1), y = v => T + (H - T - B) * (1 - (v - (mn - pad)) / (mx - mn + 2 * pad));
  let seg = '', pts = '', lab = '';
  d.forEach((p, i) => {
    if (i) seg += `<line x1="${x(i - 1)}" y1="${y(d[i - 1].valor)}" x2="${x(i)}" y2="${y(p.valor)}" stroke="${p.valor > d[i - 1].valor ? 'var(--up-l)' : 'var(--dn-l)'}" stroke-width="3.5" stroke-linecap="round"/>`;
    const ult = i === d.length - 1;
    pts += `<circle cx="${x(i)}" cy="${y(p.valor)}" r="${ult ? 7 : 4}" fill="${ult ? '#fff' : 'var(--ink)'}" stroke="${ult ? 'var(--acc)' : 'none'}" stroke-width="3.5"/>`;
    if (i === 0 || ult || p.valor === mx || p.valor === mn)
      lab += `<text class="v" x="${x(i)}" y="${y(p.valor) - 12}" text-anchor="${i === 0 ? 'start' : ult ? 'end' : 'middle'}">${fmt(p.valor)}</text>`;
    if ((d.length - 1 - i) % paso === 0) lab += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${mm ? p.anio : esc(p.mes)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Serie de ${mm ? 'años' : 'meses'}">${seg}${pts}${lab}</svg>`;
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !D) return;
  const dim = D.dimensiones;
  if (b.dataset.vista) {
    if (b.dataset.vista === st.vista) return;
    st.vista = b.dataset.vista; render(); $('#app').scrollTo({top: 0}); return;
  }
  if (b.dataset.htab) { st.htab = b.dataset.htab; hero(); return; }
  if (b.dataset.ttab) { st.ttab = b.dataset.ttab; render(); return; }
  if (b.dataset.gtab) { st.gtab = b.dataset.gtab; serie(); return; }
  if (b.dataset.tab) {
    st.tab = b.dataset.tab;
  } else if (b.dataset.ci != null) {
    st.c = ciudadSerie(dim.ciudades.items[b.dataset.ci]);
    // desde los top 5 (TOP) se abre el detalle de la ciudad en su pestaña
    if (st.vista !== 'ciu') { st.vista = 'ciu'; render(); $('#app').scrollTo({top: 0}); return; }
  } else if (b.dataset.dv != null) { st.dv = divSerie(dim.divisiones.items[b.dataset.dv]); st.htab = 'div';
    if (st.vista !== 'div') { st.vista = 'div'; render(); $('#app').scrollTo({top: 0}); return; } }
  else return;
  marcar(); hero(); serie();
});
document.addEventListener('change', e => {
  if (!D || e.target.id !== 'selLista') return;
  const dim = D.dimensiones, i = e.target.value;
  if (st.vista === 'ciu') st.c = ciudadSerie(dim.ciudades.items[i]);
  else if (st.vista === 'div') { st.dv = divSerie(dim.divisiones.items[i]); st.htab = 'div'; }
  else return;
  marcar(); hero(); serie();
});
</script>
</body>
</html>
