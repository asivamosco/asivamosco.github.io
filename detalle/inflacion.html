<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;600;700&family=Montserrat:wght@700;800&display=swap&family=Roboto+Condensed:wght@400;500;700" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/shell.css?v=26">
</head>
<body class="app det">
<header class="hd">
  <div class="hd-left">
    <h1 class="brand"><a class="home" href="../index.html" aria-label="Así Vamos, volver al inicio"><span class="brand-col"><span class="brand-txt" aria-hidden="true"><span class="b1">Así</span> <span class="b2">Vamos</span><svg class="brand-ico" viewBox="4 7 39.5 38.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="6" y="33" width="6.5" height="11"/><rect x="15" y="26" width="7" height="18"/><rect x="24.5" y="29" width="7.5" height="15"/><rect x="34.5" y="21" width="7" height="23"/><polyline points="8,21 18,14 28,18 38,11"/><g fill="#12303d"><circle cx="8" cy="21" r="2.8"/><circle cx="18" cy="14" r="2.8"/><circle cx="28" cy="18" r="2.8"/><circle cx="38" cy="11" r="2.8"/></g></svg></span><span class="brand-sub" aria-hidden="true">COLOMBIA</span></span></a></h1>
  </div>
  <div class="hd-title" id="hdTitle" aria-live="polite"></div>
  <nav class="hd-mid" aria-label="Vista">
    <button type="button" class="vt" data-vista="gen" aria-pressed="true">Nacional</button>
    <button type="button" class="vt" data-vista="dest" aria-pressed="false">Destacados</button>
    <button type="button" class="vt" data-vista="div" aria-pressed="false">Divisiones</button>
    <button type="button" class="vt" data-vista="ciu" aria-pressed="false">Ciudades</button>
  </nav>
  <div class="hd-right">
    <div class="btn-group">
      <a class="help-btn" href="../index.html" aria-label="Volver al inicio" title="Inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h5v-6h3v6h5V10"/></svg></a>
    </div>
  </div>
</header>
<main id="app" aria-live="polite"><div class="card err mute">Cargando…</div></main>
<footer class="site-foot">
  <div class="foot-in">
    <div class="ad-wrap" id="adWrap">
      <div class="ad-label">Aliado estratégico</div>
      <div class="sp" id="adA"><span>Espacio publicitario</span></div>
    </div>
    <p class="foot-txt">Así Vamos © 2026 | Datos oficiales | asivamos.co@gmail.com</p>
  </div>
</footer>

<script src="asivamos.js"></script>
<script>
const {fmt, sg, cls, flecha, nm, vp, esc} = AV;
const pp = v => vp('', v, '').replace('<span class="mute"></span>', '');
AV.init({
  ind: 'inflacion', title: 'Costo de Vida', docTitle: 'Inflación', nacTitle: 'Nacional',
  deltaMes: D => D.hero.cambio_mes_pp,
  g: {dec: 2, unit: ' %', vf: 'var_anual_pp', vs: ' pp', calcMM: true},
  prevTitle: 'Inflación de meses anteriores · vs. hace un año',
  nota: 'Variaciones en pp = puntos porcentuales',
  esNac: x => /(^|_)nac(ional)?($|_)/i.test(x.tipo || '') || /^\s*(inflaci[oó]n|costo de vida)\s+nacional\b/i.test(x.titulo || ''),
  esVarMes: x => /(variacion|var)_(del_)?(mes|mensual)|^mensual$/i.test(x.tipo || '') || /^\s*variaci[oó]n\s+(del\s+)?mes\b/i.test(x.titulo || ''),
  nac: D => { const h = D.hero; return {
    ttl: 'Inflación nacional', big: fmt(h.tasa_inflacion), unit: '%', com: h.comentario_popular,
    filas: `<div><span class="mute">Variación del mes</span><b>${fmt(h.variacion_mensual)} %</b></div>`
      + `<div><span class="mute">Mismo mes, año anterior</span><b>${fmt(h.variacion_mensual_hace_un_ano)} %</b></div>`
      + vp('Vs. mes anterior', h.cambio_mes_pp, sg(h.cambio_mes_pp)) + vp('Vs. hace un año', h.var_anual_pp, sg(h.var_anual_pp))}; },
  dims: {
    div: {
      k: 'divisiones', una: 'División', plural: 'Divisiones', ning: 'Ninguna división', titulo: 'Por división', medida: 'Inflación anual', kick: 'Inflación por división de gasto',
      ref: D => `Total nacional: ${fmt(D.hero.tasa_inflacion)} %`,
      nom: x => nm(x.division), val: x => x.var_anual, valTxt: x => fmt(x.var_anual) + ' %', vr: x => x.var_anual_pp,
      ord: (a, b) => a.puesto_anual - b.puesto_anual, serie: x => x.serie_12m, topSub: x => `hoy ${fmt(x.var_anual)} %`,
      hero: x => ({ttl: nm(x.division), big: fmt(x.var_anual), unit: '%', com: x.comentario_popular,
        filas: `<div><span class="mute">Variación del mes</span><b>${fmt(x.var_mensual)} %</b></div>`
          + vp('Vs. mes anterior', x.cambio_mes_pp, sg(x.cambio_mes_pp)) + vp('Vs. hace un año', x.var_anual_pp, sg(x.var_anual_pp))
          + vp('Frente al total nacional', x.brecha_vs_total, sg(x.brecha_vs_total))}),
      top: true,
      hijos: {label: 'Grupos', nota: 'Variación anual de cada grupo; debajo, cambio frente a hace un año en pp (puntos porcentuales).',
        get: x => { const gs = [...(x.grupos || [])].sort((a, b) => b.var_anual - a.var_anual), mx = Math.max(...gs.map(g => Math.abs(g.var_anual)), .01);
          return gs.map(g => ({nombre: nm(g.grupo), valTxt: fmt(g.var_anual) + ' %', delta: g.var_anual_pp, sub: `${flecha(g.var_anual_pp)} ${sg(g.var_anual_pp)} pp`, w: 100 * Math.abs(g.var_anual) / mx})); }}
    },
    ciu: {
      k: 'ciudades', una: 'Ciudad', plural: 'Ciudades', ning: 'Ninguna ciudad', titulo: 'Por ciudad', medida: 'Inflación anual', kick: 'Inflación por ciudad',
      ref: D => { const r = ((D.dimensiones.ciudades || {}).referencias || []).filter(r => /nacional/i.test(r.nombre)); return r.map(r => `${esc(r.nombre)}: ${fmt(r.var_anual)} %`).join(' · '); },
      nom: x => x.ciudad, val: x => x.var_anual, valTxt: x => fmt(x.var_anual) + ' %', vr: x => x.var_anual_pp,
      ord: (a, b) => a.puesto_tasa - b.puesto_tasa, serie: x => x.serie_12m, topSub: x => `hoy ${fmt(x.var_anual)} %`,
      hero: x => ({ttl: x.ciudad, big: fmt(x.var_anual), unit: '%', com: x.comentario_popular,
        filas: `<div><span class="mute">Variación del mes</span><b>${fmt(x.var_mensual)} %</b></div>`
          + vp('Vs. mes anterior', x.cambio_mes_pp, sg(x.cambio_mes_pp)) + vp('Vs. hace un año', x.var_anual_pp, sg(x.var_anual_pp))
          + vp('Frente al total nacional', x.brecha_vs_nacional, sg(x.brecha_vs_nacional))}),
      top: true,
      // Dato que ya venía en el JSON y no se mostraba: la inflación de cada división dentro de la ciudad
      hijos: {label: 'Divisiones', nota: 'Inflación anual de cada división de gasto en la ciudad; debajo, la variación del mes.',
        get: x => { const ds = [...(x.divisiones || [])].sort((a, b) => b.var_anual - a.var_anual), mx = Math.max(...ds.map(g => Math.abs(g.var_anual)), .01);
          return ds.map(g => ({nombre: nm(g.division), valTxt: fmt(g.var_anual) + ' %', sub: `mes ${fmt(g.var_mensual)} %`, w: 100 * Math.abs(g.var_anual) / mx})); }}
    }
  }
});
</script>
</body>
</html>
