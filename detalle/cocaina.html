<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cocaína · Así Vamos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;600;700&family=Montserrat:wght@700;800&display=swap&family=Roboto+Condensed:wght@400;500;700" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/shell.css?v=26">
<style>
/* Cocaína incautada: incautar más es lo bueno (ámbar) y menos lo malo (gris), al revés que en crimen */
body.det{--up:var(--ok); --dn:var(--mal); --up-l:var(--ok); --dn-l:var(--mal);
  --up-t:var(--ok-txt); --dn-t:var(--mal-txt); --up-hd:var(--ok-hd); --dn-hd:var(--mal-hd)}
body.det .row{background:rgba(var(--ok-rgb),var(--a,.1))}
</style>
</head>
<body class="app det">
<header class="hd">
  <div class="hd-left">
    <h1 class="brand"><a class="home" href="../index.html" aria-label="Así Vamos, volver al inicio"><span class="brand-col"><span class="brand-txt" aria-hidden="true"><span class="b1">Así</span> <span class="b2">Vamos</span><svg class="brand-ico" viewBox="4 7 39.5 38.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="6" y="33" width="6.5" height="11"/><rect x="15" y="26" width="7" height="18"/><rect x="24.5" y="29" width="7.5" height="15"/><rect x="34.5" y="21" width="7" height="23"/><polyline points="8,21 18,14 28,18 38,11"/><g fill="#12303d"><circle cx="8" cy="21" r="2.8"/><circle cx="18" cy="14" r="2.8"/><circle cx="28" cy="18" r="2.8"/><circle cx="38" cy="11" r="2.8"/></g></svg></span><span class="brand-sub" aria-hidden="true">COLOMBIA</span></span></a></h1>
  </div>
  <div class="hd-title" id="hdTitle" aria-live="polite"></div>
  <nav class="hd-mid" aria-label="Vista">
    <button type="button" class="vt" data-vista="gen" aria-pressed="true">Total</button>
    <button type="button" class="vt" data-vista="dest" aria-pressed="false">Destacados</button>
    <button type="button" class="vt" data-vista="dep" aria-pressed="false">Dptos</button>
    <button type="button" class="vt" data-vista="ciu" aria-pressed="false">Ciudades</button>
  </nav>
  <div class="hd-right">
    <div class="btn-group">
      <a class="help-btn" href="../index.html" aria-label="Volver al inicio" title="Inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h5v-6h3v6h5V10"/></svg></a>
    </div>
  </div>
</header>
<main id="app" aria-live="polite"><div class="card err mute">Cargando…</div></main>
<footer class="site-foot">
  <div class="foot-in">
    <div class="ad-wrap" id="adWrap">
      <div class="ad-label">Aliado estratégico</div>
      <div class="sp" id="adA"><span>Espacio publicitario</span></div>
    </div>
    <p class="foot-txt">Así Vamos © 2026 | Datos oficiales | asivamos.co@gmail.com</p>
  </div>
</footer>

<script src="asivamos.js"></script>
<script>
const {fmt, sg, cls, flecha, vp, esc} = AV;
// Unidad: sale del JSON (hero.unidad), por defecto toneladas
const UN = D => (D.hero && D.hero.unidad) || 't';
// Toneladas: 3 decimales si < 1, 2 si < 10 y 1 si >= 10, para que valores pequeños no se vean como 0
const dq = n => n == null || n === 0 ? 0 : Math.abs(n) < 1 ? 3 : Math.abs(n) < 10 ? 2 : 1;
const fq = n => fmt(n, dq(n));
const pct = (v, d = 2) => v == null ? '—' : sg(v, d) + ' %';
const SRC = D => `${D.periodo.etiqueta} · Solo Colombia (no incluye incautaciones en el exterior) · Fuente: ${D.fuente}`;
const celda = (l, t, c = '') => `<div><span class="mute">${l}</span><b${c ? ` class="${c}"` : ''}>${t}</b></div>`;
const refTxt = r => (r || []).map(x => `${esc(x.nombre)}: ${sg(x.var_anual_pct)} % vs. hace un año`).join(' · ');
const TOP_REF = 'Variación porcentual de las toneladas incautadas frente al mismo mes de hace un año; debajo, el cambio en toneladas. Toca un elemento para ver su detalle.';

// Panel de un departamento o una ciudad
const heroEnt = (x, D, ciu) => { const u = esc(UN(D)); return {
  ttl: x.nombre, big: fq(x.cantidad), unit: u, com: x.comentario_popular, src: SRC(D),
  extra: ciu && x.departamento ? `Departamento: ${esc(x.departamento)}` : '',
  filas: vp('Vs. hace un año', x.var_anual_pct, pct(x.var_anual_pct))
    + celda('Hace un año', `${fq(x.cantidad_hace_12)} ${u}`)
    + celda('Diferencia', `${flecha(x.diferencia)} ${sg(x.diferencia, dq(x.diferencia))} ${u}`, cls(x.diferencia))
    + celda('Del total nacional', `${fmt(x.participacion_pct, 1)} %`)}; };

// Hijos de la entidad elegida (departamento -> municipios), ordenados por toneladas; la barra es su peso dentro de la entidad
const hijosGet = x => { const hs = [...(x.hijos || [])].sort((a, b) => b.cantidad - a.cantidad), mx = Math.max(...hs.map(h => h.participacion_pct || 0), .01);
  return hs.map(h => ({nombre: h.nombre, valTxt: fq(h.cantidad), delta: h.var_anual_pct,
    sub: `${flecha(h.var_anual_pct)} ${h.var_anual_pct == null ? 'nuevo' : sg(h.var_anual_pct, 1) + ' %'}`, w: 100 * (h.participacion_pct || 0) / mx})); };

// Campos comunes de departamentos y ciudades
const base = k => ({
  k, medida: D => `${UN(D)} del mes`, ref: D => refTxt(((D.dimensiones || {})[k] || {}).referencias),
  nom: x => x.nombre, val: x => x.cantidad, valTxt: x => fq(x.cantidad), vr: x => x.var_anual_pct,
  opt: (x, D) => `${fq(x.cantidad)} ${UN(D)} · ${x.nombre}`,
  ord: (a, b) => a.puesto_cantidad - b.puesto_cantidad, serie: x => x.serie_12m,
  topSub: (x, D) => `${sg(x.diferencia, dq(x.diferencia))} ${UN(D)}`, top: true, topRef: TOP_REF,
  topTxt: {upS: 'aumentó sus toneladas', dnS: 'redujo sus toneladas'},
  nuevos: {txt: (x, D) => `${fq(x.cantidad)} ${UN(D)}`}
});

AV.init({
  ind: 'cocaina', title: 'Cocaína', docTitle: 'Cocaína', nacTitle: 'Cocaína incautada en Colombia',
  deltaMes: D => D.hero.var_mensual_pct,
  // Toneladas: decimales según la magnitud de la serie; variaciones con 1 decimal; sin registro previo = "nuevo"
  g: {dec: d => dq(Math.max(0, ...d.map(p => p.valor))), unit: (ctx, D) => ' ' + UN(D), vd: 1, vs: ' %', vf: 'var_anual_pct', nulo: 'nuevo', calcMM: false, mmNota: 'Cifra sobre cada punto: toneladas del mes · debajo del año: variación frente al mismo mes del año anterior'},
  prevTitle: 'Meses anteriores · vs. hace un año',
  tit: {c12: D => `Últimos 12 meses (${UN(D)})`, cmm: D => `Mismo mes por año (${UN(D)})`, ent: D => `${UN(D)} por mes: últimos 12 meses`},
  // El indicador principal no va en Destacados (ya está en el panel)
  esNac: x => x.tipo === 'indicador' || /(^|_)nac(ional)?($|_)/i.test(x.tipo || ''),
  esVarMes: x => /(variacion|var)_(del_)?(mes|mensual)|^mensual$/i.test(x.tipo || '') || /^\s*variaci[oó]n\s+(del\s+)?mes\b/i.test(x.titulo || ''),
  nac: D => { const h = D.hero, per = D.periodo, u = esc(UN(D)), ex = [];
    if (h.acumulado_anio != null) ex.push(`Acumulado ${per.anio}: ${fq(h.acumulado_anio)} ${u}${h.var_acumulado_pct != null ? ` (${sg(h.var_acumulado_pct, 1)} % vs. ${per.anio - 1})` : ''}`);
    return {ttl: 'Cocaína incautada en Colombia', big: fq(h.total), unit: u, com: h.comentario_popular, src: SRC(D), extra: ex.join('<br>'),
      filas: vp('Vs. hace un año', h.var_anual_pct, pct(h.var_anual_pct)) + vp('Vs. mes anterior', h.var_mensual_pct, pct(h.var_mensual_pct))
        + celda('Hace un año', `${fq(h.total_hace_12)} ${u}`)
        + celda('Diferencia', `${flecha(h.var_anual_abs)} ${sg(h.var_anual_abs, dq(h.var_anual_abs))} ${u}`, cls(h.var_anual_abs))}; },
  dims: {
    dep: {...base('departamentos'), una: 'Departamento', plural: 'Departamentos', ning: 'Ningún departamento', titulo: 'Por departamento', kick: 'Toneladas por departamento',
      hero: (x, D) => heroEnt(x, D, false),
      hijos: {label: 'Municipios', get: hijosGet,
        nota: (d, D) => `${esc(UN(D))} del mes; debajo, variación frente a hace un año. La barra muestra su peso dentro de ${esc(d.nombre)}.`}},
    ciu: {...base('ciudades'), una: 'Ciudad', plural: 'Ciudades', ning: 'Ninguna ciudad', titulo: 'Por ciudad', kick: 'Toneladas por ciudad',
      sub: x => x.departamento, opt: (x, D) => `${fq(x.cantidad)} ${UN(D)} · ${x.nombre}${x.departamento ? ' (' + x.departamento + ')' : ''}`,
      hero: (x, D) => heroEnt(x, D, true)}
  }
});
</script>
</body>
</html>
