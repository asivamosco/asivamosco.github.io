<!DOCTYPE html>
<html lang="es">
<head>

<body class="app det">
<header class="hd">
  <div class="hd-left">
    <h1 class="brand"><a class="home" href="../index.html" aria-label="Así Vamos, volver al inicio"><span class="brand-col"><span class="brand-txt" aria-hidden="true"><span class="b1">Así</span> <span class="b2">Vamos</span><svg class="brand-ico" viewBox="4 7 39.5 38.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="6" y="33" width="6.5" height="11"/><rect x="15" y="26" width="7" height="18"/><rect x="24.5" y="29" width="7.5" height="15"/><rect x="34.5" y="21" width="7" height="23"/><polyline points="8,21 18,14 28,18 38,11"/><g fill="#12303d"><circle cx="8" cy="21" r="2.8"/><circle cx="18" cy="14" r="2.8"/><circle cx="28" cy="18" r="2.8"/><circle cx="38" cy="11" r="2.8"/></g></svg></span><span class="brand-sub" aria-hidden="true">COLOMBIA</span></span></a></h1>
  </div>

    <button type="button" class="vt" data-vista="dest" aria-pressed="false">Destacados</button>

    </div>

<main id="app" aria-live="polite"><div class="card err mute">Cargando…</div></main>
<footer class="site-foot">
  <div class="foot-in">
    <div class="ad-wrap" id="adWrap">
      <div class="ad-label">Aliado estratégico</div>
      <div class="sp" id="adA"><span>Espacio publicitario</span></div>
    </div>
    <p class="foot-txt">Así Vamos © 2026 | Datos oficiales | asivamos.co@gmail.com</p>
  </div>
</footer>

<script src="asivamos.js"></script>
<script>
const {fmt, sg, cls, flecha, vp, esc} = AV;
const pers = m => m == null ? '—' : Math.round(m * 1000).toLocaleString('es-CO');
const persSg = m => m == null ? '—' : (m > 0 ? '+' : m < 0 ? '−' : '') + pers(Math.abs(m));
const COL_M = '#f2b01e', COL_H = '#2f6fd6';
const colSexo = n => /muj/i.test(n) ? COL_M : COL_H;
// Sexo (celular): tabla única con la tasa y las medidas de cada sexo en columnas
function sexTabla(items) {
  const c = (v, t) => `<td class="${cls(v)}">${flecha(v)} ${t}</td>`;
  const fila = (l, f) => `<tr><th scope="row">${l}</th>${items.map(f).join('')}</tr>`;
  return `<table class="sxt">
    <colgroup><col class="c0"><col><col></colgroup>
    <thead><tr><th></th>${items.map(x => `<th scope="col" style="--c:${colSexo(x.sexo)}"><i></i>${esc(x.sexo)}</th>`).join('')}</tr></thead>
    <tbody>
      <tr class="rt"><th scope="row">Tasa de desempleo</th>${items.map(x => `<td>${fmt(x.tasa_desempleo, 1)}<span>%</span></td>`).join('')}</tr>
      ${fila('Personas desocupadas', x => `<td>${pers(x.desocupados_miles)}</td>`)}
      ${fila('Vs. mes anterior', x => c(x.cambio_mes_pp, sg(x.cambio_mes_pp)))}
      ${fila('Vs. hace un año', x => c(x.var_anual_pp, sg(x.var_anual_pp)))}
      ${fila('Personas vs. hace un año', x => c(x.desocupados_var_anual_miles, persSg(x.desocupados_var_anual_miles)))}
    </tbody></table>`;
}

// Dos series en una misma escala: mujeres (amarillo) y hombres (azul)
function graficaSexo(items) {
  const S = items.map(x => ({n: x.sexo, c: colSexo(x.sexo), d: x.serie_12m || []}));
  const N = Math.min(...S.map(k => k.d.length));
  if (S.length < 2 || N < 2) return '<p class="mute">Sin datos suficientes.</p>';
  const mob = matchMedia('(max-width:600px)').matches;
  const W = mob ? 440 : 800, H = mob ? 400 : 290, L = 26, R = 26, T = 34, B = 34;
  const vs = S.flatMap(k => k.d.slice(0, N).map(p => p.valor)), mn = Math.min(...vs), mx = Math.max(...vs), pad = (mx - mn || 1) * .22;
  const x = i => L + i * (W - L - R) / (N - 1), y = v => T + (H - T - B) * (1 - (v - (mn - pad)) / (mx - mn + 2 * pad));
  const media = k => k.d.slice(0, N).reduce((a, p) => a + p.valor, 0) / N;
  const halo = 'paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round';
  let lines = '', pts = '', lab = '';
  S.forEach((k, j) => {
    const o = S[1 - j], alta = media(k) >= media(o);
    lines += `<polyline fill="none" stroke="${k.c}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" points="${k.d.slice(0, N).map((p, i) => `${x(i)},${y(p.valor)}`).join(' ')}"/>`;
    k.d.slice(0, N).forEach((p, i) => {
      const ult = i === N - 1, v = p.valor, a = k.d[i - 1] && k.d[i - 1].valor, b = k.d[i + 1] && k.d[i + 1].valor;
      pts += `<circle cx="${x(i)}" cy="${y(v)}" r="${ult ? 7 : 4.5}" fill="${ult ? '#fff' : k.c}" stroke="${ult ? k.c : '#fff'}" stroke-width="${ult ? 3.5 : 1.5}"/>`;
      if (i === 0 || ult || v === mx || v === mn || (v === Math.max(...k.d.slice(0, N).map(q => q.valor))) || (v === Math.min(...k.d.slice(0, N).map(q => q.valor)))) {
        let arriba = alta;
        if (a != null && b != null) { if (v >= a && v >= b) arriba = true; else if (v <= a && v <= b) arriba = false; }
        const dy = y(o.d[i].valor) - y(v);            // >0: la otra serie queda debajo
        if (arriba && dy < 0 && -dy < 32) arriba = false;
        if (!arriba && dy > 0 && dy < 32) arriba = true;
        lab += `<text class="v" style="${halo}" x="${x(i)}" y="${y(v) + (arriba ? -12 : 23)}" text-anchor="${i === 0 ? 'start' : ult ? 'end' : 'middle'}">${fmt(v, 1)}</text>`;
      }
    });
  });
  // Brecha (mujeres menos hombres): conector vertical en el primer mes, el último, la mayor y la menor
  const M = S.find(k => /muj/i.test(k.n)) || S[0], Hh = S.find(k => k !== M);
  const br = Array.from({length: N}, (_, i) => M.d[i].valor - Hh.d[i].valor);
  const idx = [...new Set([0, br.indexOf(Math.max(...br)), br.indexOf(Math.min(...br)), N - 1])].sort((a, b) => a - b);
  let con = '';
  idx.forEach(i => {
    const y1 = y(M.d[i].valor), y2 = y(Hh.d[i].valor), xm = x(i), ult = i === N - 1;
    con += `<line x1="${xm}" y1="${y1}" x2="${xm}" y2="${y2}" stroke="var(--mute)" stroke-width="2" stroke-dasharray="4 4"/>`;
    lab += `<text class="v" style="${halo};font-size:14px" x="${xm + (ult ? -9 : 9)}" y="${(y1 + y2) / 2 + 5}" text-anchor="${ult ? 'end' : 'start'}">${fmt(br[i], 1)} pp</text>`;
  });
  lines = con + lines;
  S[0].d.slice(0, N).forEach((p, i) => { lab += `<text style="font-size:${mob ? 12 : 15}px" x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(p.mes)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tasa de desempleo de mujeres y hombres, últimos 12 meses">${lines}${pts}${lab}</svg>`;
}


// Vista Sexo: carrusel Mujeres y hombres → Últimos 12 meses (con brecha) → Brecha de género
function vistaSexo(D) {
  const dim = D.dimensiones, per = D.periodo, br = dim.sexo.brecha, pp = (l, x) => `<div><span>${l}</span><b class="${cls(x)}">${flecha(x)} ${sg(x)}</b></div>`;
  $('#app').innerHTML = `
  <div class="top g sexo sexo2" id="top">
    <div class="cnav" id="cnav"></div>
    <div class="carw"><div class="car">
      <section class="card sxc" data-lbl="Mujeres y hombres" aria-label="Por sexo">
        <div class="sx">${dim.sexo.items.map(x => `
          <div class="pn" style="--c:${colSexo(x.sexo)}">
            <div><div class="n"><i></i>${esc(x.sexo)}</div><div class="t">${fmt(x.tasa_desempleo, 1)}<span>%</span></div><div class="ds">${pers(x.desocupados_miles)} personas desocupadas</div></div>
            <div class="pv">${pp('Vs. mes anterior', x.cambio_mes_pp)}${pp('Vs. hace un año', x.var_anual_pp)}
              <div><span>Personas vs. hace un año</span><b class="${cls(x.desocupados_var_anual_miles)}">${flecha(x.desocupados_var_anual_miles)} ${persSg(x.desocupados_var_anual_miles)}</b></div>
              <div><span>Participación (TGP)</span><b>${fmt(x.tgp, 1)} %</b></div><div><span>Ocupación</span><b>${fmt(x.tasa_ocup, 1)} %</b></div><div><span>Subempleo</span><b>${fmt(x.subempleo, 1)} %</b></div>
            </div>
          </div>`).join('')}</div>
        ${sexTabla(dim.sexo.items)}
        <p class="ref">Variaciones en puntos porcentuales (pp), salvo las de personas. ${esc(per.etiqueta)} · Fuente: ${esc(D.fuente)}</p>
      </section>
      <section class="card cg" data-lbl="Últimos 12 meses" aria-label="Serie por sexo">
        <div class="head"><h2>Mujeres y hombres: últimos 12 meses</h2>
          <div class="leg">${dim.sexo.items.map(x => `<span style="--c:${colSexo(x.sexo)}"><i></i>${esc(x.sexo)}</span>`).join('')}<span class="br"><i></i>Brecha</span></div></div>
        <div id="chart">${graficaSexo(dim.sexo.items)}</div>
      </section>${br ? `
      <section class="card hero" data-lbl="Brecha de género" aria-label="Brecha de género">
        <div class="ttl">Brecha de género</div>
        <div class="big">${fmt(br.brecha_pp, 1)}<span>pp</span></div>
        <div class="vars">${vp('Vs. hace un año', br.variacion_anual_brecha_pp, sg(br.variacion_anual_brecha_pp))}${vp('Vs. mes anterior', br.cambio_mes_pp, sg(br.cambio_mes_pp))}
          <div><span class="mute">Mujeres</span><b>${fmt(br.td_mujeres, 1)} %</b></div><div><span class="mute">Hombres</span><b>${fmt(br.td_hombres, 1)} %</b></div></div>
        <small class="mute src">${br.comentario_popular ? esc(br.comentario_popular) + '<br>' : ''}Mujeres menos hombres, en puntos porcentuales · ${esc(per.etiqueta)} · Fuente: ${esc(D.fuente)}</small>
      </section>` : ''}
    </div></div>
  </div>`;
}
const $ = s => document.querySelector(s);
AV.init({
  ind: 'desempleo', title: 'Desempleo', docTitle: 'Desempleo', nacTitle: 'Nacional',
  deltaMes: D => D.hero.cambio_mes_pp,
  g: {dec: 1, unit: ' %', vf: 'var_anual_pp', vs: ' pp', calcMM: true},
  prevTitle: 'Tasa de meses anteriores · vs. hace un año',
  nota: 'Variaciones en pp = puntos porcentuales',
  esNac: x => /(^|_)nac(ional)?($|_)/i.test(x.tipo || '') || /^\s*desempleo\s+nacional\b/i.test(x.titulo || ''),
  nac: D => { const h = D.hero; return {ttl: 'Desempleo nacional', big: fmt(h.tasa_desempleo, 1), unit: '%', com: h.comentario_popular,
    filas: vp('Vs. mes anterior', h.cambio_mes_pp, sg(h.cambio_mes_pp)) + vp('Vs. hace un año', h.var_anual_pp, sg(h.var_anual_pp))}; },
  custom: {sex: vistaSexo},
  dims: {
    ciu: {
      k: 'ciudades', una: 'Ciudad', plural: 'Ciudades', ning: 'Ninguna ciudad', titulo: 'Por ciudad', medida: 'Tasa de desempleo', kick: 'Desempleo por ciudad',
      ref: D => { const t = ((D.dimensiones.ciudades || {}).referencias || []).find(r => /23/.test(r.nombre)); return t ? `Referencia, ${esc(t.nombre)}: ${fmt(t.tasa_desempleo, 1)} % · ${pers(t.desocupados_miles)} personas.` : ''; },
      nom: x => x.ciudad, val: x => x.tasa_desempleo, valTxt: x => fmt(x.tasa_desempleo, 1) + ' %', vr: x => x.var_anual_pp,
      ord: (a, b) => a.puesto_tasa - b.puesto_tasa, serie: x => x.serie_12m, topSub: x => `hoy ${fmt(x.tasa_desempleo, 1)} %`, top: true,
      hero: (x, D) => ({ttl: x.ciudad, big: fmt(x.tasa_desempleo, 1), unit: '%', com: x.comentario_popular,
        src: `Trimestre móvil que termina en ${D.periodo.mes_nombre} ${D.periodo.anio} · Fuente: ${D.fuente}`,
        filas: `<div><span class="mute">Desocupados</span><b>${pers(x.desocupados_miles)}</b></div>`
          + vp('Vs. mes anterior', x.cambio_mes_pp, sg(x.cambio_mes_pp)) + vp('Vs. hace un año', x.var_anual_pp, sg(x.var_anual_pp))
          + vp('Personas vs. hace un año', x.desocupados_var_anual_miles, persSg(x.desocupados_var_anual_miles))}),
      // Datos que ya venían en el JSON y no se mostraban
      hijos: {label: 'Mercado laboral', rank: false, nota: 'Trimestre móvil que termina en el mes del periodo.',
        get: x => [['Participación (TGP)', x.tgp], ['Ocupación', x.tasa_ocup], ['Subempleo', x.subempleo]].filter(r => r[1] != null)
          .map(r => ({nombre: r[0], valTxt: fmt(r[1], 1) + ' %', w: Math.min(100, r[1])}))}
    }
  }
});
</script>
</body>
</html>
